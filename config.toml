# All tunable numbers and paths for music-hunter live here.
# Sections are added as each milestone needs them (SPEC.md §13).

[paths]
seeds = "seeds"                  # v2: original seeds (provided files, or downloaded from Spotify links)
collection = "collection"        # v2–v4: tracks I Add (v5: Adds go to library/)
library = "library"              # v5: audio of every playlist track (imported or Added)
references = "references"        # v1 only; retired in v2 milestone 3
keepers = "keepers"              # v1 only; retired in v2 milestone 3
cache = "cache"
data = "data"
db = "data/music_hunter.db"

[embedding]
# SPEC.md §16.1 — v3: MAEST replaces CLAP (taste test: ρ +0.28 on held-out artists vs CLAP −0.05).
# Hugging Face PyTorch weights (standard transformers class, pinned revision); the mel front end is rebuilt
# from transformers' audio utilities, so no code from the model page runs. Same model for everything:
# embeddings from different models are not comparable.
model = "mtg-upf/discogs-maest-30s-pw-129e"
revision = "e5d670316c61b18aaef46ce66242fcd73870d792"
layer = 9                    # transformer block whose output is used (best in the taste test)
device = "cuda"
sample_rate = 16000          # model's native rate
chunk_seconds = 30.0         # model's native patch length (1876 mel frames)
min_last_chunk_seconds = 15.0   # a shorter final chunk is dropped (a track shorter than one chunk is padded)
batch_size = 8               # chunks per GPU batch

[sources]
# SPEC.md §4.1, §15.5, §16.3–16.4 — v3: ~100 suggestions per source per seed (was ~50)
lastfm_similar_artists = 20     # artist.getSimilar artists per seed (seed's own artist excluded)
lastfm_top_tracks = 5            # artist.getTopTracks tracks per similar artist (20 × 5 = 100)
ytmusic_radio_limit = 100        # radio tracks per seed (seed itself excluded)
ytmusic_related_limit = 20       # v3: "You might also like" tracks per seed (YouTube gives at most ~20)
deezer_radio_limit = 100         # Deezer artist-radio tracks per seed (all credited artists, interleaved)
tidal_similar_limit = 100        # v3: TIDAL similar tracks per seed (pages of 20); seed found by ISRC via Deezer
tidal_country = "AU"
yt_search_limit = 10             # results inspected per YouTube Music search
duration_tolerance_seconds = 5   # seed and Last.fm/Deezer/TIDAL matching
api_delay_seconds = 0.5          # pause between API calls (each service)

[sources.families]
# v3: "multi-source" (agreement, multi-source-first filling) counts distinct families. Giving two sources the
# same family makes them count as one. YouTube radio and "You might also like" are kept separate for now
# (decided 2026-10-30; to be analysed after the run).
lastfm = "lastfm"
ytmusic = "ytmusic"
ytrelated = "ytrelated"
deezer = "deezer"
tidal = "tidal"

[pool]
# SPEC.md §4.1 steps 5–7
target_size = 250                # unplayed, analysed tracks to fill the pool to (v3; 150 in v2, 75 in v1)
# v3 (SPEC.md §16.4): each seed has its own share of the pool (by seed average, with the floor below), so
# seeds that few sources know (new, obscure releases) are as present as well-known ones. A share is filled
# from the top of each of the seed's source lists, by source average.
# multi_source_first: off since 2026-10-30 (my decision) — agreed tracks land naturally: they sit near the top
# of the source lists anyway (first v3 pull: 41% of a quota-filled pool), and agreement counts in the score.
# Forcing them in first filled every seed's share with them (273 for 250 places), leaving no single-source
# tracks and making controls (random pool tracks) all multi-source.
share_by_seed_average = false       # v4: equal seed shares (seeds didn't differ in v1–v3; §17.3)
multi_source_first = false
multi_source_always_added = true    # only used when multi_source_first is on
min_seed_share = 0.3333          # floor on a seed's share, as a fraction of an equal share
download_delay_seconds = 5       # minimum gap between downloads (analysis runs in the gap)
download_format = "bestaudio"    # yt-dlp format; kept in its original container, no re-encode
# SPEC.md §4.2 refills (run in the background while listening)
refill_below = 100               # pull a new generation when fewer playable tracks remain and no candidates are left
# v4 placeholder Add-seed rule (§17.8, to be discussed): pull when this many seeds haven't been pulled for yet,
# or when at least one has and refill_min_plays plays have passed since the last pull.
refill_new_seeds = 5
refill_min_plays = 15
# …or when the best unplayed track scores below this. Scores are relative to the current
# pool (components are normalised across it), so this is off (0) by default.
refill_min_best_score = 0.0

[averages]
# SPEC.md §5 — seed and source averages (learning ratings only)
prior = 2.0                      # v3: midpoint of the 1–3 scale (2.5 on v2's 1–4, 3 on v1's 1–5)
prior_strength = 3               # k
# v3: recent ratings count more by rating count, not by generation — refills can now come every few dozen
# plays, which would make per-generation decay forget too fast. A rating this many ratings back counts half.
decay_half_life_ratings = 30     # 0 = the v1/v2 rule: × decay per generation
decay = 0.5

[ratings]
# SPEC.md §16.4 — v3 buttons: 1 Off, 2 Close, 3 Add. Rating = direction (learning); Add also saves the
# track to collection/ and makes it a seed. Seeds count as Add.
labels = ["Off", "Close", "Add"]
hints = ["wrong direction", "sounds right, not a keeper", "right, and save it"]
add = 3
positive_weights = { "3" = 2.0, "2" = 0.5 }   # Add strongest; Close a mild positive
negative_weights = { "1" = 1.0 }              # Off only
# A track skipped (N) or played to the end without a rating counts as this rating, marked as automatic in the log
# (added 2026-10-30 at my request). 0 = the old rule: skipped tracks teach nothing and an unrated track waits.
unrated_counts_as = 2                         # Close

[ratings.tags]
# SPEC.md §17.7 (v4) — optional reason tags, offered after rating (under the last-rated track); several allowed,
# changeable with the most recent rating. Logged only: no effect on the veto or picks. Keyed by rating.
"1" = ["vocals", "lyrics", "too repetitive", "wrong energy", "the drop", "bassline", "too long", "know it already"]
"2" = ["vocals", "lyrics", "too repetitive", "wrong energy", "the drop", "bassline", "too long", "know it already"]
"3" = ["great vocals", "groove", "energy"]

[find]
# SPEC.md §18.2–18.3 (v5) — Find music per playlist
add_seed_stars = 3               # an Add's one-off pull is weighted like a seed with this many stars

[veto]
# SPEC.md §17.2–17.4 (v4) — every analysed track is scored; the bottom is vetoed (audio dropped, fingerprint
# kept) and picks are random from what passes. Statistics are anchored to all tracks analysed this run.
enabled = true
cut_sd = 1.25                    # vetoed when the veto score is this many robust SDs below the run's median…
return_sd = 1.0                  # …and playable again only above this (two lines: no flip-flopping)
backstop_sd = 2.5                # also vetoed: closeness to seeds this far below the median (clearly out of the area)
min_analysed = 40                # no vetoes until this many tracks are analysed (statistics need a base)
seed_top_k = 3                   # closeness to the k nearest seeds (original seeds and Adds)
like_top_k = 3                   # closeness to the k nearest likes (Close / Add weights from [ratings])
rescore_every = 10               # while filling, re-run the veto after this many new tracks

[veto.weights]                   # veto score = weighted mean of the robust z-scores of these components
seed_closeness = 1.0
like_closeness = 1.0             # left out until there are likes
sources = 1.0                    # number of distinct sources that suggested the track

[controls]
# SPEC.md §17.5 (v4) — a control is a random *vetoed* track slipped in to test the veto, at a rate the run draws
# for itself (uniform between these), stores and never shows; each play independently.
rate_min = 0.10                  # 1 in 10
rate_max = 0.1667                # 1 in 6
target = 0                       # 0 = no automatic end: `music-hunter end-run` ends the run and unseals results
                                 # (v3 ended at 25 rated controls; the first v3 run was ended early at 9)

[reweighting]
# SPEC.md §15.8 — small steps, guardrails, continuous re-evaluation against the whole history.
# Off in v4 (§17.3): picks are random, so there's no ranking to re-weight; the veto's weights are in [veto.weights].
enabled = false
first_at = 20                    # learning ratings before the first update
every = 5                        # then an update every this many learning ratings
step = 0.05                      # each weight moves at most this much per update
recency_half_life = 30           # ratings: a rating 30 back counts half in the objective
eval_window = 15                 # logged only: weights before vs after on the next this-many ratings
random_samples = 3000            # random weight vectors tried by the search
refine_rounds = 12               # local refinement rounds around the best so far
refine_batch = 250               # perturbations per refinement round

max_weight_all = 0.35            # v3: no single weight above this, so one signal can't crowd out the rest

[reweighting.min_weight]         # guardrails: magnitude never below these (keeps the core idea alive)
audio_match = 0.15
agreement = 0.15                 # v3: raised from 0.10 (agreement was the strongest signal in v1 and v2)
seed_score = 0.10                # v3: keeps seed averages steering scores (pool shares + score self-balance)

[reweighting.max_weight]         # guardrails: penalties never stronger than these
dislike_match = 0.30
diversity_penalty = 0.20

[personal_model]
# SPEC.md §7 — ridge regression from the audio embedding (MAEST, unit length) to rating; strength
# chosen per fit by leave-one-out error over these values.
alphas = [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]

[results]
# SPEC.md §11–12
rolling_window = 25
usual_keep_rate = 0.2            # "my usual ~1 in 5", shown against the Add rate (no pass criterion)

[scoring]
# SPEC.md §7
audio_match_top_k = 3            # most similar positive references averaged…
audio_match_min_refs = 5         # …but k = 1 while there are fewer references than this
dislike_top_k = 3                # v2: dislike_match = mean similarity to this many closest Off tracks
diversity_last_n = 5             # recent plays compared for diversity_penalty
# agreement = log(1 + distinct (seed, source) suggestions + credit × other sources that suggested
# the same artist but not this track). v1 check: artist suggested by 2 sources averaged 2.90 vs 2.10,
# even when the track came from one source (2.72). 0 turns it off — off in v3 (v2: −0.06, SPEC.md §16.2).
artist_agreement_credit = 0.0
# personal_model stays 0 until this many learning ratings, with at least min_each Off and min_each Close/Add.
# v3: 20 (was 50). Checked offline on v1/v2 (trained on the first N plays, tested on the rest): on v2 it helped
# from ~10–15 ratings and from 20 was worse than nothing in 1% of random draws; v1 (noisier) needed ~25–30.
# Its value is the predicted rating on the rating scale (not stretched across the pool), so an early,
# uncertain model — whose predictions all sit near the average — barely moves the ranking.
personal_model_min_ratings = 20
personal_model_min_each = 3

# v3 — scoring within each seed's pool (SPEC.md §16.4): these components are normalised among the tracks
# a seed suggested (a pool where all tie gets full credit), and a track suggested from several seeds is
# scored in each of their pools and keeps the best. seed_score (that seed's average) is compared across
# seeds, so the seed average steers scores as well as pool shares.
per_seed_components = ["agreement", "source_score", "seed_match"]

[scoring.weights]
# Initial weights (sign = direction), each within the re-weighting guardrails. Re-weighting replaces them.
audio_match = 0.30               # MAEST similarity to liked tracks (taste test: +0.27 v1, +0.44 v2)
dislike_match = -0.20
source_score = 0.10
seed_score = 0.15
agreement = 0.30                 # the strongest signal in v1 (+0.41) and v2 (+0.28)
seed_match = 0.15                # v3: MAEST similarity to the seed whose pool it's scored in
personal_model = 0.25            # contributes nothing until the model is active
diversity_penalty = -0.10
bpm_match = 0.10                 # mild (v2: +0.15)
year_match = 0.15                # v2: newer rated higher (+0.26)

[bpm]
# SPEC.md §15.6 — tempo measured from the audio, folded into [min, max) to undo half/double errors
min = 85.0
max = 175.0
analysis_sample_rate = 22050
hop_length = 256                 # analysis step (~12 ms); finer = more precise beat times
prior_width_octaves = 0.5        # 3:2 tie-break: gentle preference for tempos near the seeds' median BPM
sigma = 4.0                      # bpm_match fall-off: ~0.6 at sigma BPM from the target (or beyond the window)
max_stretch = 0.12               # Match tempo stretches at most ±12%; with a target set, tracks within ±12%
                                 # can all be played at the target and get bpm_match credit:
window_edge_credit = 0.5         # 1 at the target, falling to this at ±12%, then dropping away beyond

[year]
sigma = 3.0                      # year_match: closeness to the target year falls to ~0.6 at ±sigma years

[loudness]
# Loudness normalisation: files are kept untouched; each gets a playback gain
# (applied by the player) so it plays at target_lufs, limited so peaks stay below
# max_true_peak_db.
target_lufs = -14.0
max_true_peak_db = -1.0

[report]
session_gap_minutes = 30         # plays further apart than this start a new session

[ui]
# SPEC.md §11 — localhost player
host = "127.0.0.1"
port = 8765
# Also listen on these addresses — the PC's Tailscale IP, so my phone can open the player over Tailscale
# (http://lachlandesktop:8765). Only devices on my tailnet can reach it; nothing is opened on the home network.
# Added 2026-10-30 at my request (phone access was out of scope in §1). [] = this PC only.
extra_hosts = ["100.68.159.86"]
early_start_tracks = 20          # first pull: playback starts once this many tracks are analysed
hide_names_until_rated = true    # artist and title stay hidden until the track is rated (from 2026-10-29)
play_to_end = [2, 3]             # ratings that keep playing to the end (Close, Add; Close added 2026-10-30); Off skips
preload_next = true              # v3: while a track plays, fetch the likely next track's audio into memory
stall_log_ms = 250               # v3: only log playback stalls at least this long (v2 logged ~500 of 0–20 ms)

[tempo]
# SPEC.md §16.4 — held steady during an evaluation run: a changing target changes what "top-scored" means.
# With locked = true the player shows these and can't change them; edit them here between runs.
locked = true
target_bpm = 0.0                 # 0 = no target set: bpm_match uses the median BPM of seeds and liked tracks
match_tempo = false              # play tracks time-stretched to the target (pitch kept), within [bpm] max_stretch

[versions]
# Bracket or " - " suffix labels that mark a length/edit version of the SAME song.
# Compared after lowercasing and removing punctuation. Anything else in brackets
# (e.g. "X Remix", "Y Edit") is treated as a different track.
labels = [
    "extended mix", "extended", "extended version", "extended edit", "extended club mix",
    "extended vocal mix", "extended original mix",
    "radio edit", "radio mix", "radio version", "radio",
    "original mix", "original version", "original",
    "edit", "short edit", "single edit", "single version", "album version",
    "club mix", "club edit", "clean", "explicit",
]

[audio]
extensions = [".mp3", ".flac", ".m4a", ".opus", ".ogg", ".wav", ".aac", ".webm"]

[taste_test]
# SPEC.md §16.1 — offline taste-model test (runs in tastetest/, its own environment)
output = "runs/taste-test"
download_delay_seconds = 3       # pacing for re-downloading deleted audio
liked_v1 = 4                     # v1 (1–5): "liked" = rated at least this
liked_v2 = 3                     # v2 (1–4): On target or Add
liked_v3 = 3                     # v3 (1–3): Add
cv_folds = 5                     # cross-validation folds, grouped by artist
cv_repeats = 5                   # repeated with different artist splits
knn_k = 7                        # nearest-neighbour prediction
permutations = 200               # shuffled-rating baseline runs
bootstrap = 1000                 # resamples for 95% ranges
top_n = 10                       # top-N precision ("would its top picks have been my likes?")
pca_components = 16              # audio dimensions added to agreement/year/BPM in the "added value" test
