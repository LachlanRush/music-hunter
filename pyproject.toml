[project]
name = "music-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LachlanRush", email = "lachlan.rush@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]

[project.scripts]
music-hunter = "music_hunter:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
