<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
/* Now playing */
.now { display: grid; gap: 18px; }
.artist { font: 500 15px/1.3 var(--body); color: var(--muted); overflow-wrap: anywhere; }
.title {
  font: 800 clamp(30px, 6vw, 52px)/1.02 var(--display); font-stretch: 112%;
  letter-spacing: -0.01em; margin: 4px 0 0; text-wrap: balance; overflow-wrap: anywhere;
}
.transport { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 14px; }
.round:disabled { opacity: 0.4; cursor: default; }
.now.previous .title { color: var(--muted); }
.title.hidden-name { color: var(--muted); font-stretch: 100%; letter-spacing: 0; }
.round {
  width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center;
}
.round svg { width: 18px; height: 18px; fill: currentColor; }
.round.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seek { display: grid; gap: 4px; min-width: 0; }
.times { display: flex; justify-content: space-between; font: 400 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }

/* Rating strip */
.rate { display: grid; grid-template-columns: repeat(var(--buttons, 3), minmax(0, 1fr)); gap: 8px; }
.rate button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px;
  padding: 12px 4px 10px; display: grid; gap: 2px; justify-items: center;
}
.rate button b { font: 800 clamp(16px, 3.4vw, 22px)/1.1 var(--display); }
.rate button span { font: 400 12px/1.2 var(--body); color: var(--muted); }
.rate button:hover:not(:disabled) { border-color: var(--fg); }
.rate button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.rate button.on span { color: inherit; }
.rate button:disabled:not(.on) { opacity: 0.45; cursor: default; }
.rate button.add { border-color: var(--accent); }
.rate button.add b { color: var(--accent); }
.rate button.add.on b { color: inherit; }
.now-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: end; }
.art { width: 104px; height: 104px; border-radius: 6px; background: var(--line); object-fit: cover; display: grid;
  place-items: center; color: var(--muted); font: 800 34px/1 var(--display); }
.below { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 18px; }
.volume { display: flex; align-items: center; gap: 8px; }
.volume input { width: 120px; }
.tempo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; }
.tempo label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tempo input[type=number] { width: 76px; font: 500 14px var(--mono); padding: 4px 6px; border: 1px solid var(--line);
  border-radius: 4px; background: var(--surface); color: var(--fg); }
.tempo-note { font: 400 12px var(--mono); color: var(--muted); }
.hint { font: 400 12px/1.5 var(--mono); color: var(--muted); }

/* Preparing the pool */
.gate { display: grid; gap: 14px; padding-block: 40px; }
.gate h1 { font: 800 clamp(28px, 5vw, 40px)/1.05 var(--display); font-stretch: 112%; margin: 0; text-wrap: balance; }
.gate p { margin: 0; color: var(--muted); max-width: 60ch; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; max-width: 420px; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.4s; }

/* The most recent rating: names, artwork and a way to change it (no scores, ever) */
.reveal { border-top: 1px solid var(--line); padding-top: 22px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.reveal .art { width: 64px; height: 64px; font-size: 22px; }
.reveal-text { min-width: 0; flex: 1 1 220px; }
.reveal h2 { font: 700 18px/1.2 var(--display); margin: 4px 0 0; overflow-wrap: anywhere; }
.reveal .by { color: var(--muted); font-size: 14px; }
.chip { font: 500 12px/1 var(--mono); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.change { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.change button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 6px 10px; font: 500 13px var(--body); }
.change button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.error { color: var(--bad); font-size: 14px; }

@media (max-width: 480px) {
  .rate button span { font-size: 10px; }
  .art { width: 72px; height: 72px; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <nav><span class="brand">MUSIC HUNTER</span><a href="/" aria-current="page">Player</a><a href="/results">Results</a></nav>
    <div class="status" id="status">Connecting…</div>
  </header>

  <section class="gate" id="gate">
    <div class="label" id="gate-label">Preparing the pool</div>
    <h1 id="gate-title">Getting tracks ready</h1>
    <p id="gate-text">Checking the pool…</p>
    <div class="meter" id="gate-meter" hidden><i id="gate-fill"></i></div>
  </section>

  <section class="now" id="now" hidden>
    <div class="now-head">
      <div class="art" id="art-box" aria-hidden="true">?</div>
      <div>
        <div class="label" id="now-label">Now playing</div>
        <div class="artist" id="artist"></div>
        <h1 class="title" id="title"></h1>
      </div>
    </div>
    <div class="transport">
      <button class="round" id="back" aria-label="Back to the previous track">
        <svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7zM5 5h3v14H5z"/></svg>
      </button>
      <button class="round primary" id="play" aria-label="Pause">
        <svg viewBox="0 0 24 24" id="play-icon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position in track">
        <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
      </div>
      <button class="round" id="skip" aria-label="Skip to next track">
        <svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg>
      </button>
    </div>
    <div class="rate" id="rate" role="group" aria-label="Rate this track"></div>
    <div class="below">
      <div class="hint" id="hint">Keys: space play/pause · N skip (counts as Close) · B back</div>
      <div class="volume"><label class="label" for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" value="100"></div>
    </div>
    <div class="tempo">
      <label><input type="checkbox" id="match-tempo"> Match tempo</label>
      <label>Target <input type="number" id="target-bpm" min="40" max="220" step="0.5" aria-label="Target BPM"> BPM</label>
      <span class="tempo-note" id="tempo-note"></span>
    </div>
    <div class="error" id="error" hidden></div>
  </section>

  <section class="reveal" id="reveal" hidden></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let LABELS = {};                        // rating -> button label, from config via /api/state
let PLAY_TO_END = new Set();            // updated from the server's settings
let PRELOAD = false, STALL_MS = 250;    // [ui] preload_next, stall_log_ms

// Preloading: while a track plays, the likely next track's audio is fetched into memory, so it starts at once.
const blobs = new Map();                // track_id -> object URL of its fetched audio (a few at most)
let preloading = null, startedFromMemory = false;
async function prefetchUpcoming() {
  if (!PRELOAD || viewing !== "current") return;
  try {
    const up = await api("/api/upcoming");
    if (blobs.has(up.track_id) || preloading === up.track_id) return;
    preloading = up.track_id;
    const res = await fetch(up.audio);
    if (!res.ok) throw new Error(res.statusText);
    blobs.set(up.track_id, URL.createObjectURL(await res.blob()));
    for (const [id, url] of blobs) {        // keep the newest three, never the one playing
      if (blobs.size <= 3) break;
      if (url !== audio.src) { URL.revokeObjectURL(url); blobs.delete(id); }
    }
  } catch (e) { /* preloading is only a speed-up; the normal load still works */ }
  finally { preloading = null; }
}

function buildButtons(labels, hints, add) {
  // The rating buttons, as configured ([ratings] labels and hints in config.toml).
  const el = $("rate");
  el.style.setProperty("--buttons", labels.length);
  LABELS = Object.fromEntries(labels.map((l, i) => [i + 1, l]));
  el.innerHTML = labels.map((l, i) =>
    `<button data-r="${i + 1}"${i + 1 === add ? ' class="add"' : ""}><b>${l}</b><span>${hints[i] ?? ""}</span></button>`
  ).join("");
  el.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => rate(Number(b.dataset.r))));
}

const audio = new Audio();
audio.preload = "auto";
let ctx = null, gainNode = null;
let current = null;        // track awaiting or holding a rating
let ratedCurrent = null;   // rating given to the current track (it keeps playing for 3–5)
let currentEnded = false;  // the current track has finished playing
let viewing = "current";   // "current" or "previous" (after pressing back)
let prev = null;           // the previous track while viewing it
let resume = null;         // {pos, played} of the current track, to return to after back
let played = 0, lastPos = 0, seeking = false, started = false;
let loadStart = 0, awaitingFirstPlay = false, stallStart = null;

function onAir() { return viewing === "previous" ? prev : current; }

// Operational log: start latency, stalls, audio errors, track ends, script errors.
function report(kind, data = {}) {
  fetch("/api/event", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({kind, play_id: onAir() ? onAir().play_id : null, data})}).catch(() => {});
}
window.addEventListener("error", (e) => report("page_error", {message: e.message, line: e.lineno}));
window.addEventListener("unhandledrejection", (e) => report("page_error", {message: String(e.reason)}));

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }

// --- polling: pool readiness and status line -------------------------------------------
async function poll() {
  try {
    const s = await api("/api/state");
    const busy = s.worker.state === "running" ? ` · <span class="busy">${s.worker.message}</span>` : "";
    const err = s.worker.state === "error" ? ` · <span class="neg">Pool worker failed: ${s.worker.message}</span>` : "";
    $("status").innerHTML = `${s.unplayed} of ${s.pool_target} in the pool · ${s.rated} rated${busy}${err}`;
    if (!started) renderGate(s);
    if (s.play_to_end) PLAY_TO_END = new Set(s.play_to_end);
    PRELOAD = !!s.preload_next; STALL_MS = s.stall_log_ms ?? STALL_MS;
    if (s.labels && !$("rate").children.length) buildButtons(s.labels, s.hints || [], s.add);
    if (s.last && !$("reveal").dataset.loaded) renderReveal(s.last);
  } catch (e) {
    $("status").textContent = "Can't reach the music-hunter server. Is `music-hunter serve` running?";
  }
}

function renderGate(s) {
  if (s.run_complete) {
    $("gate-label").textContent = "Run complete";
    $("gate-title").textContent = "That's the run";
    $("gate-text").innerHTML = `${s.rated} tracks rated. The results are unsealed: <a href="/results">see them here</a>.`;
    $("gate-meter").hidden = true;
  } else if (s.ready) {
    started = true;
    $("gate").hidden = true;
    $("now").hidden = false;
    loadNext({autoplay: false});            // shown paused; the play button is the first click
  } else if (s.seeds === 0) {
    $("gate-label").textContent = "No seeds yet";
    $("gate-title").textContent = "Add your seed tracks first";
    $("gate-text").textContent = "Run `music-hunter add-seeds <Spotify links>`, then restart `music-hunter serve`.";
    $("gate-meter").hidden = true;
  } else if (s.unplayed === 0 && s.worker.state !== "running") {
    $("gate-label").textContent = "Pool empty";
    $("gate-title").textContent = "No unplayed tracks";
    $("gate-text").textContent = "Run `music-hunter pull` to fetch a new generation, then reload.";
    $("gate-meter").hidden = true;
  } else {
    $("gate-label").textContent = "Preparing the pool";
    $("gate-title").textContent = `${s.unplayed} of ${s.early_start} tracks ready`;
    $("gate-text").textContent = `${s.worker.message || "Working…"} Playback can start once ${s.early_start} tracks are analysed; the rest join as they finish.`;
    $("gate-meter").hidden = false;
    $("gate-fill").style.width = `${Math.min(100, 100 * s.unplayed / s.early_start)}%`;
  }
}

// --- playback ----------------------------------------------------------------------
let volumeNode = null;
function ensureAudioGraph() {
  if (ctx) return;
  ctx = new AudioContext();
  gainNode = ctx.createGain();                   // per-track loudness normalisation
  volumeNode = ctx.createGain();                 // the volume slider, applied after it
  volumeNode.gain.value = Number($("volume").value) / 100;
  ctx.createMediaElementSource(audio).connect(gainNode).connect(volumeNode).connect(ctx.destination);
}
try { const v = localStorage.getItem("volume"); if (v !== null) $("volume").value = v; } catch (e) {}
$("volume").addEventListener("input", () => {
  const v = Number($("volume").value);
  if (volumeNode) volumeNode.gain.value = v / 100;
  try { localStorage.setItem("volume", String(v)); } catch (e) {}
});

async function loadNext({autoplay = true} = {}) {
  showError("");
  try {
    current = await api("/api/next", {});
  } catch (e) {
    current = null;
    audio.pause();
    $("now").hidden = true;
    started = false;
    $("gate").hidden = false;
    poll();
    return;
  }
  ratedCurrent = null; currentEnded = false;
  viewing = "current"; prev = null; resume = null;
  await loadTrack(current, 0, 0, autoplay);
}

async function loadTrack(track, startAt, alreadyPlayed, autoplay = true) {
  ensureAudioGraph();
  played = alreadyPlayed; lastPos = startAt;
  showNames(track);
  gainNode.gain.value = Math.pow(10, track.gain_db / 20);   // loudness normalisation
  const cached = blobs.get(track.track_id);
  startedFromMemory = !!cached;
  audio.src = cached || track.audio;
  if (startAt) audio.addEventListener("loadedmetadata", () => { audio.currentTime = startAt; }, {once: true});
  applyTempo(track);
  loadStart = performance.now(); awaitingFirstPlay = autoplay; stallStart = null;
  $("seek").value = 0;
  $("dur").textContent = fmt(track.duration_s);
  renderRating();
  if (!autoplay) { setPlayIcon(false); return; }
  try { await unlockAudio(); await audio.play(); }
  catch (e) {
    awaitingFirstPlay = false;               // no start-latency figure for a track that waited for a click
    setPlayIcon(false);
    report("audio_error", {message: `autoplay blocked: ${e.name}`});
  }
}

// --- tempo: target BPM steers ranking (server) and, with "Match tempo", playback speed ---------
let settings = {target_bpm: null, match_tempo: false, effective_target_bpm: null, max_stretch: 0.12};

async function loadSettings() {
  try { settings = await api("/api/settings"); } catch (e) { return; }
  $("match-tempo").checked = settings.match_tempo;
  $("target-bpm").value = settings.target_bpm ?? "";
  $("match-tempo").disabled = $("target-bpm").disabled = !!settings.locked;   // held steady for the run
  $("target-bpm").title = settings.locked ? "Locked for this run: change it in config.toml [tempo]" : "";
  $("target-bpm").placeholder = settings.effective_target_bpm ? settings.effective_target_bpm.toFixed(1) : "";
  if (onAir()) applyTempo(onAir());
}

async function saveSettings() {
  const v = $("target-bpm").value.trim();
  try {
    settings = await api("/api/settings", {target_bpm: v === "" ? null : Number(v), match_tempo: $("match-tempo").checked});
  } catch (e) { showError(`Couldn't save the tempo setting: ${e.message}`); return; }
  $("target-bpm").placeholder = settings.effective_target_bpm ? settings.effective_target_bpm.toFixed(1) : "";
  if (onAir()) applyTempo(onAir());
}

function applyTempo(track) {
  let rate = 1, note = "";
  const target = settings.effective_target_bpm;
  if (settings.match_tempo && target && track.bpm) {
    const r = target / track.bpm, pct = Math.round((r - 1) * 100);
    if (Math.abs(r - 1) <= settings.max_stretch) {
      rate = r; note = `Playing at ${target.toFixed(1)} BPM (${pct >= 0 ? "+" : ""}${pct}%)`;
    } else {
      note = `Original tempo: matching needs ${pct >= 0 ? "+" : ""}${pct}%, beyond ±${Math.round(settings.max_stretch * 100)}%`;
    }
  } else if (settings.match_tempo && !track.bpm) {
    note = "Original tempo: no BPM measured for this track";
  }
  if (settings.locked) note = note ? `${note} · locked for this run` : "Tempo locked for this run";
  audio.preservesPitch = audio.mozPreservesPitch = audio.webkitPreservesPitch = true;
  audio.defaultPlaybackRate = rate;
  audio.playbackRate = rate;
  $("tempo-note").textContent = note;
}
$("match-tempo").addEventListener("change", saveSettings);
$("target-bpm").addEventListener("change", saveSettings);
$("target-bpm").addEventListener("focus", () => {        // start from the default target, not the box's minimum
  if ($("target-bpm").value === "" && settings.effective_target_bpm) $("target-bpm").value = settings.effective_target_bpm.toFixed(1);
});
$("target-bpm").addEventListener("keydown", (e) => { if (e.key === "Enter") $("target-bpm").blur(); });

function tempoReport() {
  const t = onAir();
  return {played_bpm: t && t.bpm ? Math.round(t.bpm * audio.playbackRate * 10) / 10 : null,
          playback_rate: Math.round(audio.playbackRate * 1000) / 1000};
}

// Artist and title arrive only once a track is rated (server setting hide_names_until_rated).
function showNames(track) {
  const hidden = track.title == null;
  $("artist").textContent = hidden ? "Artist, title and artwork appear once you rate" : track.artist;
  $("title").textContent = hidden ? "Hidden until rated" : track.title;
  $("title").classList.toggle("hidden-name", hidden);
  $("art-box").innerHTML = track.art ? `<img class="art" src="${track.art}" alt="">` : "?";
}

// Browsers only allow sound after a click or key press; any of them unlocks it.
async function unlockAudio() {
  ensureAudioGraph();
  if (ctx.state === "suspended") await ctx.resume();
}

async function goBack() {
  if (viewing === "previous") return;
  showError("");
  let track;
  try {
    const exclude = current && ratedCurrent !== null ? `?exclude=${current.play_id}` : "";
    track = await api(`/api/previous${exclude}`);
  } catch (e) { showError("There's no previous track yet."); return; }
  resume = current && !currentEnded ? {pos: audio.currentTime, played} : null;
  viewing = "previous"; prev = track;
  report("back", {to: track.play_id});
  await loadTrack(track, 0, 0);
}

async function goForward() {
  if (viewing !== "previous") return;
  report("forward", {});
  viewing = "current"; prev = null;
  if (current && resume) { const r = resume; resume = null; await loadTrack(current, r.pos, r.played); }
  else loadNext();
}

function renderRating() {
  const onPrev = viewing === "previous";
  const shown = onPrev ? prev.rating : ratedCurrent;
  document.querySelectorAll("#rate button").forEach((b) => {
    b.classList.toggle("on", Number(b.dataset.r) === shown);
    b.disabled = onPrev ? !prev.can_change : ratedCurrent !== null;
  });
  $("now").classList.toggle("previous", onPrev);
  $("now-label").textContent = onPrev ? "Previous track" : "Now playing";
  $("back").disabled = onPrev;
  $("skip").setAttribute("aria-label", onPrev ? "Return to the current track" : "Skip to next track");
  if (onPrev) {
    const back = resume ? "N returns to the current track where you left it" : "N moves on";
    $("hint").textContent = !prev.can_change
      ? `${LABELS[prev.rating] ?? "Not rated"} · only your most recent rating can be changed · ${back}`
      : prev.rating === null ? `You skipped this one · rate it now with the buttons · ${back}`
      : `${LABELS[prev.rating]} · press another button to change it · ${back}`;
  } else {
    $("hint").textContent = ratedCurrent === null
      ? "Keys: space play/pause · N skip (counts as Close) · B back"
      : `${LABELS[ratedCurrent]} · plays to the end, then the next track starts · N skips ahead · B back`;
  }
}

async function ratePrevious(r) {
  if (!prev.can_change || r === prev.rating) return;
  try {
    const rev = prev.rating === null
      ? await api("/api/rate", {play_id: prev.play_id, rating: r, played_seconds: Math.round(played), ...tempoReport()})
      : await api("/api/change", {rating: r});
    renderReveal(rev);
    prev = {...prev, ...rev, can_change: true};
    if (!PLAY_TO_END.has(r)) { goForward(); return; }   // Off skips at once (config play_to_end)
    showNames(prev);
    renderRating();
    if (audio.ended) goForward();
  } catch (e) { showError(`Couldn't save the rating: ${e.message}`); }
  poll();
}

async function rate(r) {
  if (viewing === "previous") return ratePrevious(r);
  if (!current || ratedCurrent !== null) return;
  try {
    const rev = await api("/api/rate", {play_id: current.play_id, rating: r, played_seconds: Math.round(played),
                                        ...tempoReport()});
    renderReveal(rev);
    current = {...current, artist: rev.artist, title: rev.title, art: rev.art};
    if (!PLAY_TO_END.has(r)) { loadNext(); return; }    // Off skips at once (config play_to_end)
    showNames(current);
    ratedCurrent = r;                         // Close and Add play to the end
    renderRating();
    if (audio.ended) loadNext();
    else prefetchUpcoming();                  // the rating may have changed what comes next
  } catch (e) { showError(`Couldn't save the rating: ${e.message}`); }
  poll();
}

async function skip() {
  if (viewing === "previous") return goForward();
  if (!current) return;
  if (ratedCurrent === null) {             // no rating given: the server counts it as Close (config)
    try {
      const res = await api("/api/skip", {play_id: current.play_id, played_seconds: Math.round(played)});
      if (res.rated) renderReveal(res);       // shows what it was, and lets you change it
    } catch (e) { showError(`Couldn't skip: ${e.message}`); return; }
  }
  loadNext();
  poll();
}

async function changeRating(r) {
  try {
    const rev = await api("/api/change", {rating: r});
    renderReveal(rev);
    if (viewing === "previous" && prev && rev.play_id === prev.play_id) {
      prev = {...prev, ...rev, can_change: true};
      if (!PLAY_TO_END.has(r)) goForward(); else renderRating();
    } else if (current && rev.play_id === current.play_id) {
      if (!PLAY_TO_END.has(r)) { loadNext(); } else { ratedCurrent = r; renderRating(); }
    }
  } catch (e) { showError(`Couldn't change the rating: ${e.message}`); }
  poll();
}

audio.addEventListener("timeupdate", () => {
  const d = audio.duration || onAir()?.duration_s || 0;
  const delta = audio.currentTime - lastPos;
  if (!audio.paused && delta > 0 && delta < 1.5) played += delta;
  lastPos = audio.currentTime;
  if (!seeking && d) $("seek").value = Math.round(1000 * audio.currentTime / d);
  $("pos").textContent = fmt(audio.currentTime);
  if (audio.duration) $("dur").textContent = fmt(audio.duration);
});
audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("playing", () => {
  const now = performance.now();
  if (awaitingFirstPlay) {
    report("playing", {latency_ms: Math.round(now - loadStart), preloaded: startedFromMemory});
    awaitingFirstPlay = false;
    prefetchUpcoming();                       // fetch the likely next track while this one plays
  } else if (stallStart !== null && now - stallStart >= STALL_MS) {
    report("stall", {ms: Math.round(now - stallStart), at_s: Math.round(audio.currentTime)});
  }
  stallStart = null;
});
audio.addEventListener("waiting", () => { if (!awaitingFirstPlay && !seeking) stallStart = performance.now(); });
audio.addEventListener("error", () => {
  if (audio.error) report("audio_error", {code: audio.error.code, message: audio.error.message || ""});
});
audio.addEventListener("pause", () => setPlayIcon(false));
audio.addEventListener("ended", () => {
  if (viewing === "previous") {
    report("ended", {rated: prev.rating, played_s: Math.round(played), previous: true});
    goForward();
    return;
  }
  report("ended", {rated: ratedCurrent, played_s: Math.round(played)});
  currentEnded = true;
  if (ratedCurrent !== null) loadNext();
  else skip();                                // played to the end without a rating: counts as Close, next track
});

function setPlayIcon(playing) {
  $("play-icon").innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
  $("play").setAttribute("aria-label", playing ? "Pause" : "Play");
}
async function togglePlay() {
  if (!onAir()) return;
  if (!audio.paused) { audio.pause(); return; }
  await unlockAudio();
  if (audio.currentTime === 0 && !awaitingFirstPlay) { loadStart = performance.now(); awaitingFirstPlay = true; }
  audio.play().catch((e) => showError(`Couldn't start playback: ${e.message}`));
}

$("seek").addEventListener("input", () => { seeking = true; });
$("seek").addEventListener("change", () => {
  const d = audio.duration || onAir()?.duration_s || 0;
  audio.currentTime = d * $("seek").value / 1000;
  lastPos = audio.currentTime;
  seeking = false;
});
$("play").addEventListener("click", togglePlay);
$("skip").addEventListener("click", skip);
$("back").addEventListener("click", goBack);
document.addEventListener("pointerdown", () => { if (ctx) unlockAudio(); });
document.addEventListener("keydown", (e) => {
  if (!started || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest("input, textarea, select")) return;   // typing in a box never controls playback
  unlockAudio();
  // No number-key ratings: rating needs a click on a button (typing a BPM once rated tracks by accident).
  if (e.key === " " && e.target.tagName !== "BUTTON") { togglePlay(); e.preventDefault(); }
  else if (e.key === "n" || e.key === "N") { skip(); }
  else if (e.key === "b" || e.key === "B") { goBack(); }
});

// --- reveal ------------------------------------------------------------------------
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

function renderReveal(rev) {
  // The most recent rating: names, artwork and a way to change it. Never a score (SPEC.md §15.3).
  const el = $("reveal");
  el.dataset.loaded = "1";
  const change = Object.keys(LABELS).map(Number).map((r) =>
    `<button class="${r === rev.rating ? "on" : ""}" data-change="${r}">${LABELS[r]}</button>`).join("");
  el.innerHTML = `
    ${rev.art ? `<img class="art" src="${rev.art}" alt="">` : `<div class="art" aria-hidden="true">♪</div>`}
    <div class="reveal-text">
      <div class="label">Last rated</div>
      <h2>${esc(rev.title)}</h2>
      <div class="by">${esc(rev.artist)}</div>
    </div>
    <span class="chip">${LABELS[rev.rating]}</span>
    <div class="change"><span class="label">Change</span>${change}</div>`;
  el.hidden = false;
  el.querySelectorAll("[data-change]").forEach((b) =>
    b.addEventListener("click", () => changeRating(Number(b.dataset.change))));
}

poll();
loadSettings();
setInterval(poll, 4000);
</script>
</body>
</html>
