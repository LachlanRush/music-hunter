<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* In a browser, pages run inside the shell, which keeps the music going between pages (static/shell.js); the app is its own shell */
if (window.top === window && !window.NativeAudioBridge) location.replace("/shell#" + location.pathname + location.search);
else if (window.top !== window) document.documentElement.classList.add("framed");</script>
<title>Music Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/nav.js"></script>
<script src="/static/ui.js"></script>
<style>
h1 { font: 700 20px/1.2 var(--display); margin: 0; }      /* the same as "Add" below */
.status:empty { display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.card { display: grid; gap: 4px; align-content: start; text-decoration: none; color: inherit; min-width: 0; }
.card:hover .cover { filter: brightness(1.08); }
.cover { aspect-ratio: 1; border-radius: 6px; background: var(--raised); display: grid; place-items: center;
  overflow: hidden; font: 800 42px var(--display); color: var(--faint); margin-bottom: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.card b { font: 700 15px/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .desc { font-size: 12px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card .bar { margin-top: 6px; }
@media (max-width: 600px) {                       /* phones: three across */
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .card { gap: 2px; }
  .cover { margin-bottom: 6px; font-size: 28px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
  .card b { font-size: 13px; }
  .card .meta { font-size: 11px; }
}

/* Sections: my folders and the built-in Playlists, each opened and closed with its arrow (as clean as the Feedback
   fold-out), dragged by the name row into any order. */
.home { display: grid; gap: 6px; }
.folder-head { display: flex; align-items: center; gap: 6px; padding: 6px 0; cursor: grab; user-select: none;
  -webkit-user-select: none; -webkit-touch-callout: none; }
.folder-toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-width: 0; }
.folder-toggle .chev { width: 20px; height: 20px; fill: var(--muted); transition: transform .2s; flex: none; }
.folder.closed .chev { transform: rotate(-90deg); }
.folder-toggle b { font: 700 16px/1.3 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder-toggle .meta { margin-left: 4px; }
.folder-toggle:hover b { text-decoration: underline; text-underline-offset: 3px; }
.folder-more { position: relative; margin-left: auto; }
.folder-more .icon-btn { width: 32px; height: 32px; }
.folder .grid { padding: 6px 0 18px 0; }
.folder.closed .grid { display: none; }
.folder.dragging { opacity: .3; }
body.dragging-card .folder:not(.closed) .grid:empty { display: block; min-height: 80px; border: 2px dashed rgba(255, 255, 255, 0.18); border-radius: 8px; margin-bottom: 12px; }

/* Dragging a playlist (into or out of a folder, or to a new place) */
.card { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.card.dragging { opacity: .25; }
.card.held { transform: scale(.96); transition: transform .15s; }
.menu.fixed { position: fixed; right: auto; top: auto; }
.ghost { position: fixed; z-index: 50; pointer-events: none; width: 120px; border-radius: 6px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); transform: translate(-50%, -60%) scale(1.04); opacity: .95; }
.ghost img, .ghost div { width: 120px; height: 120px; object-fit: cover; display: grid; place-items: center;
  background: var(--raised); font: 800 36px var(--display); color: var(--faint); }
.folder-ghost { width: auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--raised);
  font: 700 15px var(--display); transform: translate(-50%, -50%); }
.folder.drop-here > .folder-head { background: var(--accent-soft); outline: 2px solid rgba(255, 255, 255, 0.35); outline-offset: -2px; }
body.dragging-card { cursor: grabbing; }
.add { display: grid; gap: 12px; padding-top: 12px; }
.add h2 { font: 700 20px/1.2 var(--display); margin: 0; }
form { display: flex; flex-wrap: wrap; gap: 8px; }
form input { flex: 1 1 260px; min-width: 0; }
.add .btn { padding: 9px 18px; }
.new-row { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <div class="status" id="status"></div>

  <section class="home" id="home" aria-label="Your playlists and folders"><div class="empty">Loading…</div></section>

  <section class="add" aria-label="Add a playlist">
    <form id="import-form">
      <input id="spotify" type="url" placeholder="Spotify playlist link — https://open.spotify.com/playlist/…" aria-label="Spotify playlist link" required>
      <button type="submit" class="btn">Import</button>
    </form>
    <div class="new-row"><button class="btn" id="new-playlist">New playlist</button><button class="btn" id="new-folder">New folder</button></div>
    <div class="error" id="error" hidden></div>
  </section>
</main>
<input id="picture" type="file" accept="image/*" hidden>
<dialog id="details">
  <h3>Edit details</h3>
  <form method="dialog">
    <input type="text" id="d-name" aria-label="Name" placeholder="Name" maxlength="200" required>
    <textarea id="d-desc" aria-label="Description" placeholder="Add an optional description" maxlength="500"></textarea>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M7 9.5l5 5 5-5z"/></svg>';

async function api(path, body, method) {
  const res = await fetch(path, body === undefined && !method ? {} : {
    method: method || "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body ?? {}),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}
function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }

function jobLine(job) {
  if (!job || job.state === "done" || job.state === "failed") return "";
  const p = job.progress || {};
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  return `<div class="bar live" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="meta">${job.state === "queued" ? "Waiting to import…" : `Importing ${p.done || 0} of ${p.total || "?"}`}</div>`;
}
const card = (p) => `
  <a class="card" href="/playlist/${p.id}" data-id="${p.id}" draggable="false">
    <div class="cover">${p.image ? `<img src="${p.image}" alt="" draggable="false">` : esc((p.name || "?")[0].toUpperCase())}</div>
    <b>${esc(p.name)}</b>
    ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ""}
    ${jobLine(p.job)}
  </a>`;

// Which folders are closed is remembered on this device.
const closed = (() => { try { return new Set(JSON.parse(localStorage.getItem("closedFolders") || "[]").map(String)); } catch (e) { return new Set(); } })();
function saveClosed() { try { localStorage.setItem("closedFolders", JSON.stringify([...closed])); } catch (e) {} }

// The list as last seen shows at once; each playlist's page data is fetched ahead, so opening one is instant.
const cache = {get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
let prefetched = false;
function prefetch(lists) {
  if (prefetched) return;
  prefetched = true;
  lists.forEach((p, i) => setTimeout(() => api(`/api/playlists/${p.id}`)
    .then((d) => cache.set(`playlist:${p.id}`, d)).catch(() => {}), 300 + 150 * i));
}
let timer = null;
setInterval(() => { if (!document.hidden && !timer) load(); }, 10000);   // imports started elsewhere show up too
async function load() {
  try {
    const [lists, folders] = await Promise.all([api("/api/playlists"), api("/api/folders")]);
    cache.set("home", {lists, folders});
    show(lists, folders);
    prefetch(lists);
    const busy = lists.some((p) => p.job && (p.job.state === "running" || p.job.state === "queued"));
    clearTimeout(timer);
    timer = busy ? setTimeout(load, 3000) : null;
  } catch (e) { $("status").textContent = "Can't reach the music-hunter server."; }
}
function show(lists, folders) {
  if (typeof Drag !== "undefined" && Drag.busy()) return;    // not while something is being dragged
  // Sections, in the order I dragged them into: my folders and the built-in Playlists (id 0, everything in no folder,
  // where new playlists go). Each opens and closes with its arrow; only my folders have a ⋯ (rename, delete).
  const mine = new Set(folders.filter((f) => !f.builtin).map((f) => f.id));
  const sections = folders.map((f, i) => ({...f, n: f.builtin ? 1000 : i}))
    .sort((x, y) => ((x.position == null) - (y.position == null)) || ((x.position ?? 0) - (y.position ?? 0)) || (x.n - y.n));
  const html = sections.map((f) => {
    const inside = lists.filter((p) => (f.builtin ? !mine.has(p.folder_id) : p.folder_id === f.id));
    const key = String(f.id);
    return `<div class="folder ${closed.has(key) ? "closed" : ""}" data-folder="${f.id}">
      <div class="folder-head">
        <span class="folder-toggle" data-toggle="${key}" role="button" tabindex="0" aria-expanded="${!closed.has(key)}">
          ${CHEV}<b>${esc(f.name)}</b><span class="meta">${inside.length}</span></span>
        ${f.builtin ? "" : `<div class="folder-more"><button class="icon-btn" data-folder-more="${f.id}" aria-label="More for ${esc(f.name)}">⋯</button></div>`}
      </div>
      <div class="grid">${inside.map(card).join("")}</div>
    </div>`;
  }).join("");
  // Unchanged since the cached view: left alone, so the covers don't flash.
  if (html !== $("home").dataset.html) { $("home").innerHTML = html; $("home").dataset.html = html; }
}

document.addEventListener("click", async (e) => {
  const toggle = e.target.closest("[data-toggle]");
  if (toggle) {
    const id = toggle.dataset.toggle, box = toggle.closest(".folder");
    box.classList.toggle("closed");
    box.classList.contains("closed") ? closed.add(id) : closed.delete(id);
    toggle.setAttribute("aria-expanded", String(!box.classList.contains("closed")));
    saveClosed();
    return;
  }
  const more = e.target.closest("[data-folder-more]");
  const act = e.target.closest("[data-folder-act]");
  // (read before the menu goes: the Delete of a removed menu couldn't find its folder, so nothing happened)
  const actName = act && act.closest(".folder")?.querySelector(".folder-toggle b")?.textContent;
  document.querySelectorAll(".menu:not(.fixed)").forEach((m) => m.remove());
  if (more) {
    const m = document.createElement("div");
    m.className = "menu";
    m.innerHTML = `<button data-folder-act="rename" data-id="${more.dataset.folderMore}">Rename</button>
      <button data-folder-act="delete" data-id="${more.dataset.folderMore}" style="color:var(--bad)">Delete folder</button>`;
    more.parentElement.appendChild(m);
    return;
  }
  if (act) {
    const id = Number(act.dataset.id), name = actName || "this folder";
    try {
      if (act.dataset.folderAct === "rename") {
        const n = await askText("Rename folder", {value: name, ok: "Rename"});
        if (n) await api(`/api/folders/${id}`, {name: n}, "PATCH");
      } else if (await ask(`Delete the folder "${name}"?`, {detail: "Its playlists stay; they move to Playlists.", ok: "Delete", danger: true})) {
        await api(`/api/folders/${id}`, undefined, "DELETE");
      }
    } catch (err) { showError(err.message); }
    load();
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-toggle]")) { e.preventDefault(); e.target.click(); }
});
$("new-folder").addEventListener("click", async () => {
  const name = await askText("New folder", {placeholder: "Folder name", ok: "Create"});
  if (!name) return;
  try { await api("/api/folders", {name}); load(); } catch (e) { showError(e.message); }
});

$("import-form").addEventListener("submit", async (e) => {
  e.preventDefault(); showError("");
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Reading…";
  try {
    const r = await api("/api/playlists", {spotify_url: $("spotify").value.trim()});
    go(`/playlist/${r.playlist_id}`);
  } catch (err) { showError(`Couldn't import: ${err.message}`); }
  btn.disabled = false; btn.textContent = "Import";
});
$("new-playlist").addEventListener("click", async () => {
  showError("");
  const name = await askText("New playlist", {placeholder: "Playlist name", ok: "Create"});
  if (!name) return;
  try {
    const r = await api("/api/playlists", {name});
    go(`/playlist/${r.playlist_id}`);
  } catch (err) { showError(`Couldn't create it: ${err.message}`); }
});
// --- dragging playlists: into a folder (drop on it), out of one (drop among the loose playlists), or to a new place.
// A mouse drags straight away; a finger holds for a moment first, so scrolling still works.
const Drag = (() => {
  let d = null, justDragged = false;
  const HOLD_MS = 350, SLOP = 8;
  const at = (x, y) => document.elementFromPoint(x, y);
  // What's picked up: a playlist (its card) or a folder (by its name row).
  const pick = (t) => t.closest(".card[data-id]") || (!t.closest(".folder-more") && t.closest(".folder-head")?.parentElement) || null;
  function begin(card, x, y) {
    const folder = card.classList.contains("folder");
    const img = !folder && card.querySelector(".cover img");
    const ghost = document.createElement("div");
    ghost.className = folder ? "ghost folder-ghost" : "ghost";
    ghost.innerHTML = folder ? `<b>${esc(card.querySelector(".folder-toggle b").textContent)}</b>`
      : img ? `<img src="${img.src}" alt="">` : `<div>${esc(card.querySelector("b").textContent[0] || "?")}</div>`;
    document.body.appendChild(ghost);
    card.classList.add("dragging");
    document.body.classList.add("dragging-card");
    d = {...d, card, ghost, folder, active: true};
    move(x, y);
    if (navigator.vibrate) navigator.vibrate(15);
  }
  function move(x, y) {
    d.ghost.style.left = `${x}px`; d.ghost.style.top = `${y}px`;
    if (y < 70) window.scrollBy(0, -12); else if (y > innerHeight - 70) window.scrollBy(0, 12);   // near an edge: scroll
    document.querySelectorAll(".drop-here").forEach((f) => f.classList.remove("drop-here"));
    const el = at(x, y);
    if (!el) return;
    if (d.folder) {                                     // a section goes above or below another
      const top = el.closest("#home > .folder");
      if (!top || top === d.card) return;
      const r = top.getBoundingClientRect();
      $("home").insertBefore(d.card, y > r.top + r.height / 2 ? top.nextSibling : top);
      return;
    }
    const head = el.closest(".folder-head"), over = el.closest(".card");
    if (head) { head.parentElement.classList.add("drop-here"); return; }      // into the folder, at its end
    if (over && over !== d.card) {                                             // beside another playlist
      const r = over.getBoundingClientRect(), after = x > r.left + r.width / 2;
      over.parentElement.insertBefore(d.card, after ? over.nextSibling : over);
      return;
    }
    const grid = el.closest(".grid");                                          // an empty space in a grid: its end
    if (grid && d.card.parentElement !== grid) grid.appendChild(d.card);
  }
  async function end(x, y) {
    const {card, ghost} = d;
    ghost.remove();
    card.classList.remove("dragging");
    document.body.classList.remove("dragging-card");
    const into = document.querySelector(".folder.drop-here");
    document.querySelectorAll(".drop-here").forEach((f) => f.classList.remove("drop-here"));
    if (into && !d.folder) into.querySelector(".grid").appendChild(card);
    const wasFolder = d.folder;
    d = null; justDragged = true; setTimeout(() => { justDragged = false; }, 50);
    // The whole page's order, folders and playlists together (a folder's playlists after it).
    const items = [];
    for (const block of $("home").children) {
      const fid = Number(block.dataset.folder);
      items.push(fid ? {kind: "folder", id: fid} : {kind: "loose"});
      block.querySelectorAll(".card[data-id]").forEach((c) => items.push({kind: "playlist", id: Number(c.dataset.id)}));
    }
    try {
      if (!wasFolder) {
        const box = card.closest("[data-folder]");
        await api(`/api/playlists/${card.dataset.id}/folder`, {folder_id: box ? (Number(box.dataset.folder) || null) : null}, "PUT");
      }
      await api("/api/home-order", {items}, "PUT");
    } catch (e) { showError(`Couldn't move it: ${e.message}`); }
    load();
  }
  function cancel() {
    if (d && d.timer) clearTimeout(d.timer);
    if (d && d.active) { d.ghost.remove(); d.card.classList.remove("dragging"); document.body.classList.remove("dragging-card"); load(); }
    d = null;
  }
  // Mouse
  document.addEventListener("mousedown", (e) => {
    const card = e.button === 0 && pick(e.target);
    if (card) d = {card, x0: e.clientX, y0: e.clientY, active: false};
  });
  document.addEventListener("mousemove", (e) => {
    if (!d || d.touch) return;
    if (!d.active && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > SLOP) begin(d.card, e.clientX, e.clientY);
    else if (d.active) move(e.clientX, e.clientY);
  });
  document.addEventListener("mouseup", (e) => { if (d && !d.touch) { d.active ? end(e.clientX, e.clientY) : (d = null); } });
  // Finger: hold, then drag
  document.addEventListener("touchstart", (e) => {
    const card = pick(e.target);
    if (!card || e.touches.length > 1) return;
    const t = e.touches[0];
    lastTouch = Date.now();
    d = {card, x0: t.clientX, y0: t.clientY, active: false, touch: true};
    // Held: let go without moving for the playlist's options; move to drag it.
    d.timer = setTimeout(() => {
      if (d && !d.active) { d.held = true; card.classList.add("held"); if (navigator.vibrate) navigator.vibrate(15); }
    }, HOLD_MS);
  }, {passive: true});
  document.addEventListener("touchmove", (e) => {
    if (!d || !d.touch) return;
    const t = e.touches[0], far = Math.hypot(t.clientX - d.x0, t.clientY - d.y0) > SLOP;
    if (!d.active && !d.held) { if (far) { clearTimeout(d.timer); d = null; } return; }   // scrolling
    e.preventDefault();                                   // held: dragging, not scrolling
    if (!d.active) { if (!far) return; d.card.classList.remove("held"); begin(d.card, t.clientX, t.clientY); }
    d.x = t.clientX; d.y = t.clientY;
    move(t.clientX, t.clientY);
  }, {passive: false});
  document.addEventListener("touchend", (e) => {
    if (!d || !d.touch) return;
    clearTimeout(d.timer);
    if (d.active) { e.preventDefault(); end(d.x ?? d.x0, d.y ?? d.y0); return; }
    if (d.held) {                                          // held and let go: a playlist's options
      e.preventDefault();
      d.card.classList.remove("held");
      if (d.card.dataset.id) PlMenu.open(Number(d.card.dataset.id), d.x0, d.y0);
    }
    d = null;
  });
  document.addEventListener("touchcancel", cancel);
  let lastTouch = 0;
  document.addEventListener("contextmenu", (e) => {        // right-click: its options (a hold is handled above)
    const card = e.target.closest(".card[data-id]");
    if (!card) return;
    e.preventDefault();
    if (Date.now() - lastTouch > 1500) PlMenu.open(Number(card.dataset.id), e.clientX, e.clientY);
  });
  document.addEventListener("click", (e) => { if (justDragged && e.target.closest(".card, .folder-head")) { e.preventDefault(); e.stopPropagation(); } }, true);
  return {busy: () => !!(d && d.active)};
})();

// --- a playlist's options (right-click, or hold and let go): the same as its ⋯ on the playlist page -----------------
const PlMenu = (() => {
  let pid = null, info = null;
  const Phone = window.NativeAudioBridge || null;
  function place(m, x, y) {
    document.body.appendChild(m);
    const r = m.getBoundingClientRect();
    m.style.left = `${Math.max(8, Math.min(x, innerWidth - r.width - 8))}px`;
    m.style.top = `${Math.max(8, Math.min(y, innerHeight - r.height - 8))}px`;
  }
  function close() { document.querySelectorAll(".menu").forEach((m) => m.remove()); }
  async function open(id, x, y) {
    close();
    pid = id;
    info = cache.get(`playlist:${id}`);
    try { info = await api(`/api/playlists/${id}`); cache.set(`playlist:${id}`, info); } catch (e) { if (!info) return showError(e.message); }
    let dl = null;
    if (Phone) { try { const s = JSON.parse(Phone.offlineState(id)); dl = s.on; } catch (e) {} }
    const m = document.createElement("div");
    m.className = "menu fixed";
    m.innerHTML = `<div class="label">${esc(info.name)}</div>
      <button data-act="details">Edit details</button>
      <button data-act="picture">${info.image ? "Change picture" : "Add picture"}</button>
      <button data-act="folder">${info.folder_id ? "Move to another folder" : "Move to folder"}</button>`
      + (info.can_refresh ? `<button data-act="refresh">Refresh from Spotify</button>` : "")
      + (Phone ? `<button data-act="download">${dl ? "Downloaded" : "Download"}</button>` : "")
      + `<button data-act="sync">${info.sync && info.sync.on ? "Synced" : "Sync"}</button>
      <button data-act="results">Results</button><hr>
      <button data-act="delete" style="color:var(--bad)">Delete playlist</button>`;
    place(m, x, y);
  }
  function folders(x, y) {
    close();
    const m = document.createElement("div");
    m.className = "menu fixed";
    m.innerHTML = `<div class="label">Move to folder</div>` + (info.folders || []).map((f) =>
        `<button data-act="to" data-folder="${f.id}">${f.id === info.folder_id ? "✓ " : ""}${esc(f.name)}</button>`).join("")
      + `<button data-act="to" data-folder="new">New folder…</button>`
      + (info.folder_id ? `<hr><button data-act="to" data-folder="none">Move to Playlists</button>` : "");
    place(m, x, y);
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest(".menu.fixed [data-act]");
    if (!b) { if (!e.target.closest(".menu.fixed")) document.querySelectorAll(".menu.fixed").forEach((m) => m.remove()); return; }
    const act = b.dataset.act, r = b.getBoundingClientRect();
    if (act === "folder") return folders(r.left, r.top);
    close();
    try {
      if (act === "details") { $("d-name").value = info.name; $("d-desc").value = info.description || ""; $("details").showModal(); return; }
      if (act === "picture") { $("picture").click(); return; }
      if (act === "refresh") await api(`/api/playlists/${pid}/import`, {});
      if (act === "download") { const s = JSON.parse(Phone.offlineState(pid));
        if (s.on && !await ask("Remove the downloads from this phone?", {detail: "It will still play while you're connected.", ok: "Remove"})) return; Phone.offlineSet(pid, !s.on); }
      if (act === "sync") await api(`/api/playlists/${pid}/sync`, {on: !(info.sync && info.sync.on)}, "PUT");
      if (act === "results") return go(`/playlist/${pid}/results`);
      if (act === "delete") {
        if (!await ask(`Delete "${info.name}"?`, {ok: "Delete", danger: true, detail: "This can't be undone: the playlist, its stars, "
            + "its Find music and its Recently deleted list go, and songs in no other playlist lose their audio."})) return;
        await api(`/api/playlists/${pid}`, undefined, "DELETE");
      }
      if (act === "to") {
        let fid = b.dataset.folder;
        if (fid === "new") { const name = await askText("New folder", {placeholder: "Folder name", ok: "Create"}); if (!name) return; fid = (await api("/api/folders", {name})).folder_id; }
        await api(`/api/playlists/${pid}/folder`, {folder_id: fid === "none" ? null : Number(fid)}, "PUT");
      }
    } catch (err) { showError(err.message); }
    load();
  });
  $("details").addEventListener("close", async () => {
    if ($("details").returnValue !== "save") return;
    try { await api(`/api/playlists/${pid}`, {name: $("d-name").value, description: $("d-desc").value}, "PATCH"); load(); }
    catch (e) { showError(e.message); }
  });
  $("picture").addEventListener("change", async () => {
    const f = $("picture").files[0];
    if (!f) return;
    try {
      const res = await fetch(`/api/playlists/${pid}/cover`, {method: "POST", body: await f.arrayBuffer()});
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "Couldn't use that picture");
      load();
    } catch (e) { showError(e.message); }
    $("picture").value = "";
  });
  return {open};
})();

{ const c = cache.get("home"); if (c) show(c.lists, c.folders); }
load();
</script>
<script src="/static/feedback.js"></script>
</body>
