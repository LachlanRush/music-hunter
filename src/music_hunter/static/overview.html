<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Results · Music Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<style>
/* Off red, Add blue: the app's diverging rating pair (validated earlier on these surfaces). */
.viz { --off: #e34948; --add: #2a78d6; --grid: #e1e5e9; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz { --off: #e66767; --add: #3987e5; --grid: #2b3137; }
}
:root[data-theme="dark"] .viz { --off: #e66767; --add: #3987e5; --grid: #2b3137; }
main { max-width: 860px; }
h1 { font: 800 clamp(26px, 5vw, 40px)/1.05 var(--display); font-stretch: 112%; margin: 0; }
.sub { color: var(--muted); margin: 0; max-width: 68ch; font-size: 14px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: 3px; }
.chart h2 { margin: 2px 4px 8px; font: 700 17px var(--display); }
.chart .sub { margin: 2px 4px 8px; font-size: 13px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 6px; }
svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
svg text { font: 400 11px var(--mono); fill: var(--muted); }
svg text.end { font: 600 12px var(--body); }
#tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); font: 400 12px/1.4 var(--body);
  padding: 6px 9px; border-radius: 6px; z-index: 10; }
</style>
</head>
<body>
<main class="viz">
  <header>
    <nav><a class="brand" href="/">MUSIC HUNTER</a><a class="backlink" id="back" href="/" aria-label="Back to the playlist">←</a></nav>
  </header>
  <section style="display:grid;gap:8px">
    <h1 id="name">Results</h1>
    <p class="sub">Off and Add in Find music by the track's score when it played, from the gate (0) up. Each point averages the plays near that score; dashed where few plays support it. Ticks along the bottom are the plays.</p>
  </section>
  <div class="legend"><span><i style="background:var(--off)"></i>Off</span><span><i style="background:var(--add)"></i>Add</span></div>
  <div class="chart"><p class="sub" id="count"></p><svg id="chart" role="img" aria-label="Off and Add rate by score"></svg></div>
  <div id="tip" hidden></div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
(async () => {
  const pid = location.pathname.split("/")[2];
  document.getElementById("back").href = `/playlist/${pid}`;
  const d = await (await fetch(`/api/playlists/${pid}/results`)).json();
  const svg = document.getElementById("chart"), tip = document.getElementById("tip");
  document.getElementById("name").textContent = d.name ? `${d.name} · Results` : "Results";
  document.title = `${d.name} · Results · Music Hunter`;
  document.getElementById("count").textContent = d.plays < 2 ? "Not enough rated plays yet." :
    `${d.plays} rated plays above the gate · ${d.off}% Off · ${d.add}% Add`;
  if (d.plays < 2) { svg.remove(); return; }
  d.ymax = Math.min(100, Math.ceil(Math.max(10, ...d.curve.flatMap(c => [c.off, c.add])) / 10) * 10 + 10);
  draw(d, svg, tip);
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => draw(d, svg, tip), 150); });
})();

function draw(d, svg, tip) {
  svg.replaceChildren();
  // Drawn in screen pixels, so text keeps its size on a phone.
  const W = Math.max(300, Math.round(svg.parentElement.clientWidth - 24)), H = W < 520 ? 280 : 360;
  const L = 40, R = 40, T = 14, B = 46;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const ymax = d.ymax;
  const x = v => L + (W - L - R) * v / d.max, y = v => T + (H - T - B) * (1 - v / ymax);
  for (let v = 0; v <= ymax; v += ymax > 60 ? 20 : 10) {
    svg.append(el("line", {x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: "var(--grid)"}));
    svg.append(el("text", {x: L - 8, y: y(v) + 4, "text-anchor": "end"}, `${v}%`));
  }
  const step = d.max > 3 || W < 520 ? 1 : 0.5;
  for (let v = 0; v <= d.max + 1e-9; v += step)
    svg.append(el("text", {x: x(v), y: H - B + 18, "text-anchor": "middle"}, v.toFixed(1)));
  svg.append(el("text", {x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle"}, "score when played (0 = the gate)"));
  for (const v of d.rug) svg.append(el("line", {x1: x(v), x2: x(v), y1: H - B, y2: H - B + 5, stroke: "var(--muted)", "stroke-opacity": 0.5}));
  for (const key of ["off", "add"]) {
    let seg = [], thin = null;
    const flush = () => { if (seg.length > 1) svg.append(el("path", {d: "M" + seg.join("L"), fill: "none",
      stroke: `var(--${key})`, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
      "stroke-dasharray": thin ? "4 4" : "none"})); };
    d.curve.forEach((p, i) => {
      const t = p.n < d.thin_n;
      if (thin !== null && t !== thin) { flush(); seg = [seg[seg.length - 1]]; }
      thin = t; seg.push(`${x(p.x).toFixed(1)},${y(p[key]).toFixed(1)}`);
    });
    flush();
  }
  // Direct labels at the right end, pushed apart when the lines meet there.
  const last = d.curve[d.curve.length - 1];
  let yo = Math.min(y(last.off), H - B - 4), ya = Math.min(y(last.add), H - B - 4);
  if (Math.abs(yo - ya) < 14) {                      // push the upper label up so the two don't overlap
    if (last.off >= last.add) yo = ya - 14; else ya = yo - 14;
  }
  svg.append(el("text", {x: x(last.x) + 6, y: yo + 4, class: "end", style: "fill: var(--off)"}, "Off"),
             el("text", {x: x(last.x) + 6, y: ya + 4, class: "end", style: "fill: var(--add)"}, "Add"));
  const cross = el("line", {y1: T, y2: H - B, stroke: "var(--muted)", "stroke-dasharray": "2 3", visibility: "hidden"});
  const dots = ["off", "add"].map(k => el("circle", {r: 4, fill: `var(--${k})`, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden"}));
  svg.append(cross, ...dots);
  const move = ev => {
    const pt = svg.getBoundingClientRect(), sx = (ev.clientX - pt.left) * W / pt.width;
    if (sx < L || sx > W - R) return leave();
    const p = d.curve.reduce((a, b) => Math.abs(x(b.x) - sx) < Math.abs(x(a.x) - sx) ? b : a);
    cross.setAttribute("x1", x(p.x)); cross.setAttribute("x2", x(p.x)); cross.setAttribute("visibility", "visible");
    ["off", "add"].forEach((k, i) => { dots[i].setAttribute("cx", x(p.x)); dots[i].setAttribute("cy", y(p[k])); dots[i].setAttribute("visibility", "visible"); });
    tip.hidden = false;
    tip.textContent = `score ${p.x.toFixed(2)} · Off ${p.off}% · Add ${p.add}% · ~${Math.round(p.n)} plays`;
    tip.style.left = Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = (ev.clientY - 36) + "px";
  };
  const leave = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dots.forEach(c => c.setAttribute("visibility", "hidden")); };
  svg.onpointermove = move;
  svg.onpointerleave = leave;
}
</script>
<script src="/static/feedback.js"></script>
</body>
</html>
