<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* In a browser, pages run inside the shell, which keeps the music going between pages (static/shell.js); the app is its own shell */
if (window.top === window && !window.NativeAudioBridge) location.replace("/shell#" + location.pathname + location.search);
else if (window.top !== window) document.documentElement.classList.add("framed");</script>
<title>Playlist · Music Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/nav.js"></script>
<script src="/static/ui.js"></script>
<script src="/static/colour.js"></script>
<script src="/static/tempo.js"></script>
<script src="/static/media.js"></script>
<script src="/static/shuffle.js"></script>
<style>
body { padding-bottom: 150px; }
main { overflow-anchor: none; }                   /* the page keeps its own place when rows move (keepView) */
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: end; padding-top: 8px; position: relative; }
/* The back arrow, level with the top of the cover: in the margin to its left on a computer; at the left edge on a
   phone, beside the centred cover */
.head .backlink { position: absolute; top: 8px; left: -54px; }
.status:empty { display: none; }
@media (max-width: 1440px) and (min-width: 601px) { .head { padding-left: 50px; } .head .backlink { left: 0; } }
.cover { width: 200px; height: 200px; border-radius: 6px; background: var(--raised); display: grid; place-items: center;
  overflow: hidden; font: 800 64px var(--display); color: var(--faint); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); }
.cover img { width: 100%; height: 100%; object-fit: cover; }
h1 { font: 800 clamp(30px, 6vw, 56px)/1.05 var(--display); letter-spacing: -0.03em; margin: 0 0 8px; overflow-wrap: anywhere; }
#name, .desc { cursor: text; }
.desc { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.45; max-width: 60ch; white-space: pre-line; }
.head .meta { font-size: 14px; color: var(--fg); opacity: .85; }
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions .play-big { width: 44px; height: 44px; }            /* Play first, smaller (2026-11-11) */
.actions .play-big svg { width: 20px; height: 20px; }
.pl-menu, .more { position: relative; }
.pl-menu .menu { left: 0; right: auto; }
.filter { appearance: none; -webkit-appearance: none; background: rgba(255, 255, 255, 0.07); border-radius: 999px;
  padding: 7px 14px; font: 600 13px var(--body); color: var(--fg); border: 0; cursor: pointer; }
.filter, .filter.on { background: var(--accent-soft); color: var(--accent); }   /* in the playlist's colour */
#find { border: 0; background: rgba(255, 255, 255, 0.07); padding: 7px 14px; font: 600 13px var(--body); }   /* like All tracks */
#find:hover:not(:disabled) { transform: none; background: rgba(255, 255, 255, 0.12); }
#find.ready { background: var(--accent-soft); color: var(--accent); }
#find.ready.on { background: var(--accent); color: #111; }       /* Find music playing in the bar */
.tempo { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 14px; color: var(--muted); }
.tempo label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.tempo input[type=checkbox] { width: 16px; height: 16px; margin: 0; }
.tempo input[type=number] { width: 72px; padding: 5px 8px; }
.tempo input:disabled { opacity: .45; }
#job { display: grid; gap: 10px; justify-items: start; }
.sortbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 14px; border-radius: var(--radius);
  background: var(--accent-soft); font-size: 14px; }
.sortbar b { color: var(--accent); }
h2 { font: 700 20px/1.2 var(--display); margin: 0 0 8px; letter-spacing: -0.01em; }
h2 .meta { font-weight: 400; margin-left: 8px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; }
li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; gap: 12px; align-items: center;
  padding: 6px 8px; margin-inline: -8px; border-radius: 6px; }
@media (hover: hover) { li[data-row]:not(.unavailable):hover { background: rgba(255, 255, 255, 0.07); } }
li.playing .t b { color: var(--accent); }
li.unavailable { opacity: .45; }
.row-step { color: var(--accent); }
li.filtered { opacity: .4; }
li.found { animation: found 1.4s ease-out; }
@keyframes found { from { background: var(--accent-soft); } to { background: transparent; } }
.art { width: 44px; height: 44px; border-radius: 4px; background: var(--raised); object-fit: cover; display: block; }
.cover-btn { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 4px; background: var(--raised);
  overflow: hidden; display: grid; place-items: center; color: var(--faint); cursor: default; }
.cover-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.t { min-width: 0; }
.t b { display: block; font: 500 15px/1.3 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t span.sub { color: var(--faint); font-size: 12px; }
.stars { display: flex; gap: 2px; margin-left: 8px; }
.stars button { border: 0; background: none; padding: 4px 2px; font-size: 19px; line-height: 1; color: rgba(255, 255, 255, 0.16); }
.stars button.on { color: var(--accent); }
@media (hover: hover) { .stars button:hover { color: var(--fg); } }
.more > button { border: 0; background: none; font-size: 20px; padding: 4px 8px; color: var(--muted); border-radius: 50%; }
.more > button:hover { color: var(--fg); }
.menu.sub-open .main-items { display: none; }

/* The player: a bar along the bottom, the page blurred behind it */
/* Now playing, full view (feedback #58/#59; #61: fills the screen, play in the middle, slides up, swipe the cover to
   change song, drag down to close). */
.np { position: fixed; inset: 0; z-index: 30; display: flex; justify-content: center; overflow: hidden auto;
  background: linear-gradient(180deg, var(--glow, rgba(255,255,255,.06)) 0%, var(--bg) 70%), var(--bg);
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); will-change: transform; touch-action: none; }
.np.in { transform: none; }
.np.drag { transition: none; }
.np-in { width: min(100%, 520px); height: 100vh; height: 100dvh; min-height: 520px; display: flex; flex-direction: column; gap: 18px;
  padding: max(12px, env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); }
.np-top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; text-align: center; }
.np-top .from { font-size: 12px; color: var(--muted); line-height: 1.3; }
.np-top .from b { display: block; color: var(--fg); font-size: 14px; cursor: pointer; }
.np-top .from b:hover { text-decoration: underline; }
.np-stage { flex: 1 1 0; min-height: 140px; container-type: size; display: grid; place-items: center; cursor: grab; }
.np-art { width: min(100cqw, 100cqh); aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: var(--raised);
  box-shadow: 0 14px 40px rgba(0,0,0,.55); user-select: none; -webkit-user-drag: none; will-change: transform; }
.np-art.slide { transition: transform .26s cubic-bezier(.2, .8, .2, 1), opacity .26s; }
.np-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.np-meta .t { min-width: 0; }
.np-meta .t b { display: block; font: 700 22px/1.25 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-meta .t span { display: block; color: var(--muted); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-meta .side { display: flex; align-items: center; gap: 4px; flex: none; }
.np-meta .stars button { font-size: 22px; }
.np-meta .vote { width: 44px; height: 44px; }
.np-meta .vote svg { width: 26px; height: 26px; }
.np-stars2 { margin: -10px 0 0 -10px; }
.np-stars2 .stars button { font-size: 22px; }
.np-seek { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.np-seek input { width: 100%; }
.np-controls { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 18px; }
.np-controls > :first-child { justify-self: start; }
.np-controls > :last-child { justify-self: end; }
.np-controls .round { width: 52px; height: 52px; }
.np-controls .round svg { width: 26px; height: 26px; }
.np-controls .round.primary { width: 72px; height: 72px; }
/* Opened over another page (the bar there, #62): only the view shows; the page it belongs to stays out of sight. */
html.np-solo, html.np-solo body { background: transparent !important; }
html.np-solo body::before { display: none; }
html.np-solo body > :not(#np) { visibility: hidden !important; }
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(22, 22, 24, 0.55); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4);
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35); transition: background .6s; }
.framed .player { display: none !important; }       /* in the browser shell its bar plays this part (static/shell.js) */
.player-in { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.player .art { width: 48px; height: 48px; border-radius: 5px; }
.player .art, .player .t { cursor: pointer; }
.player .t b { font-weight: 700; }
.player .t span { color: rgba(255, 255, 255, 0.72); }
.controls { display: flex; gap: 2px; align-items: center; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--fg);
  display: grid; place-items: center; padding: 0; }
.round svg { width: 18px; height: 18px; fill: currentColor; }
.round.primary { background: var(--fg); color: #111; }
.round.on { color: var(--accent); }
.round[hidden] { display: none; }
/* Find music's − / + beside the song's name (2026-11-11; like Spotify's +): outlined, filled once chosen */
.controls .slot { width: 72px; display: flex; justify-content: flex-end; align-items: center; }   /* shuffle, or − / + in Find music */
.vote { flex: none; width: 34px; height: 34px; border: 0; padding: 0; background: none; color: rgba(255, 255, 255, 0.75); display: grid; place-items: center; cursor: pointer; }
.vote[hidden] { display: none; }
.vote svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.vote:hover { color: var(--fg); }
.vote.on { color: var(--accent); }
.vote.on svg { stroke-width: 3; }
.round.loading { position: relative; }
.round.loading::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid transparent;
  border-top-color: var(--fg); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.seek { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center;
  font: 400 11px var(--body); color: rgba(255, 255, 255, 0.7); }
.add-song { display: flex; gap: 8px; }
.add-song input { flex: 1 1 auto; min-width: 0; border-radius: 999px; }
.deleted ol { margin-top: 8px; }
.del-all { margin-top: 10px; }
.del-all .btn { padding: 6px 14px; font-size: 13px; }
.deleted li { grid-template-columns: 44px minmax(0, 1fr) auto; cursor: pointer; }
@media (hover: hover) { .deleted li:not(.unavailable):hover { background: rgba(255, 255, 255, 0.07); } }
.deleted .acts { display: flex; gap: 6px; }
.deleted .acts button { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.28);
  background: none; font: 600 12px var(--body); color: var(--fg); }
/* Add to playlist: every playlist with its cover, ticked where the song is; tick and untick, then Done */
.sheet { padding: 18px 16px; }
.sheet .sheet-song { color: var(--muted); font-size: 13px; margin: -8px 0 10px; }
.sheet ul { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; }
.sheet li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px;
  margin: 0; border-radius: 6px; cursor: pointer; }
.sheet li:hover { background: rgba(255, 255, 255, 0.06); }
.sheet li.sheet-sec { display: block; padding: 12px 6px 4px; cursor: default; font: 700 12px var(--body); letter-spacing: .04em;
  text-transform: uppercase; color: var(--muted); }
.sheet li.sheet-sec:hover { background: none; }
.sheet .pic { width: 44px; height: 44px; border-radius: 4px; background: var(--surface); object-fit: cover; display: grid;
  place-items: center; color: var(--faint); font: 800 18px var(--display); }
.sheet li b { font: 500 15px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet .tick { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.4); display: grid; place-items: center; }
.sheet li.on .tick { background: var(--accent); border-color: var(--accent); }
.sheet li.on .tick::after { content: ""; width: 6px; height: 11px; border: solid #111; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
/* Dragging a song within its stars */
li[data-row] { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
li.held { background: rgba(255, 255, 255, 0.1); }
li.dragging { background: var(--raised) !important; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5); position: relative; z-index: 3; }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 20px); z-index: 30; opacity: 0;
  background: var(--fg); color: #111; font: 600 13px var(--body); padding: 8px 14px; border-radius: 999px;
  pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#mh-download { display: none; }                           /* (the button an older app adds; it's in the ⋯ menu now) */
.menu button.off { color: var(--muted); }                 /* Download and Sync while they're off */
.volume { display: none; width: 90px; }
@media (hover: hover) and (pointer: fine) { .volume { display: block; } }
@media (max-width: 600px) {
  .head { grid-template-columns: 1fr; justify-items: center; gap: 18px; }
  .head .backlink { left: 0; }
  .head-text { justify-self: stretch; }
  .cover { width: min(62vw, 240px); height: min(62vw, 240px); }
  h1 { font-size: clamp(26px, 8vw, 34px); }
  li { gap: 10px; }
  .stars { margin-left: 2px; }
  .stars button { font-size: 18px; padding: 4px 1px; }
}
</style>
</head>
<body class="glow">
<main>
  <div class="status" id="status"></div>

  <section class="head">
    <a class="backlink" href="/" aria-label="Back to playlists">‹</a>
    <div class="cover" id="cover">?</div>
    <div class="head-text">
      <h1 id="name">Loading…</h1>
      <p class="desc" id="desc" hidden></p>
      <div class="meta" id="counts"></div>
    </div>
  </section>

  <section class="actions">
    <button class="play-big" id="play-all" aria-label="Play"><svg viewBox="0 0 24 24" id="play-all-icon"><path d="M8 5l12 7-12 7z"/></svg></button>
    <button class="icon-btn" id="shuffle-all" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h3.5l7 10H18v-2l3 3-3 3v-2h-4.5l-7-10H4zm10.5 0H18V5l3 3-3 3V9h-3.5l-1.6 2.3-1.2-1.7zM4 17h3.5l1.6-2.3 1.2 1.7L8.5 19H4z"/></svg></button>
    <button class="btn" id="find">Find music</button>
    <select class="filter" id="min-stars" aria-label="Play only tracks with at least">
      <option value="0">All tracks</option><option value="1">★ 1+</option><option value="2">★ 2+</option>
      <option value="3">★ 3+</option><option value="4">★ 4+</option><option value="5">★ 5</option>
    </select>
    <div class="pl-menu"><button class="icon-btn" id="pl-more" aria-label="More for this playlist" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button></div>
    <input id="picture" type="file" accept="image/*" hidden>
  </section>

  <section class="tempo" aria-label="Tempo">
    <label><input type="checkbox" id="same-bpm"> Set to</label>
    <label><input type="number" id="bpm-target" min="60" max="200" step="0.5" inputmode="decimal" aria-label="Target BPM"> BPM</label>
    <span class="meta" id="tempo-note"></span>
  </section>

  <section id="find-status" hidden></section>
  <section id="importing" hidden></section>
  <div class="error" id="error" hidden></div>

  <div class="sortbar" id="sortbar" hidden><span>Sorted by sound like <b id="sort-name"></b></span>
    <button class="link" id="sort-clear">Back to normal order</button></div>

  <section id="added-section" hidden>
    <h2>To rate <span class="meta" id="added-count"></span></h2>
    <ol id="added"></ol>
  </section>
  <section>
    <h2 id="tracks-label">Tracks <span class="meta" id="tracks-count"></span></h2>
    <ol id="tracks"></ol>
  </section>
  <section id="pending-section" hidden>
    <h2 id="pending-label">Downloading <span class="meta" id="pending-count"></span></h2>
    <ol id="pending"></ol>
  </section>
  <form class="add-song" id="add-song">
    <input id="add-link" type="url" placeholder="Add a song — Spotify or YouTube Music link" aria-label="Song link" required>
    <button class="btn" type="submit">Add</button>
  </form>
  <section id="job" hidden></section>
  <details class="failures deleted" id="deleted-section" hidden>
    <summary id="deleted-label">Recently deleted</summary>
    <div class="del-all"><button class="btn danger" id="delete-all">Delete all</button></div>
    <ol id="deleted"></ol>
  </details>
<div id="menu-room" aria-hidden="true"></div>
</main>

<dialog id="sheet" class="sheet">
  <h3>Add to playlist</h3>
  <div class="sheet-song" id="sheet-song"></div>
  <ul id="sheet-list"></ul>
  <div class="row"><button class="btn" id="sheet-cancel">Cancel</button><button class="btn primary" id="sheet-done">Done</button></div>
</dialog>

<dialog id="details">
  <h3>Edit details</h3>
  <form method="dialog" id="details-form">
    <input type="text" id="d-name" aria-label="Name" placeholder="Name" maxlength="200" required>
    <textarea id="d-desc" aria-label="Description" placeholder="Add an optional description" maxlength="500"></textarea>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="save">Save</button></div>
  </form>
</dialog>

<div class="np" id="np" hidden role="dialog" aria-label="Now playing">
  <div class="np-in">
    <div class="np-top" id="np-top">
      <button class="icon-btn" id="np-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="from" id="np-from"></div><span></span>
    </div>
    <div class="np-stage" id="np-stage"><img class="np-art" id="np-art" alt="" draggable="false" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"></div>
    <div class="np-meta"><div class="t"><b id="np-title"></b><span id="np-artist"></span></div><div class="side" id="np-side"></div></div>
    <div class="np-stars2" id="np-stars2"></div>
    <div class="np-seek"><span id="np-pos">0:00</span><input type="range" id="np-seek" min="0" max="1000" value="0" aria-label="Position"><span id="np-dur">0:00</span></div>
    <div class="np-controls" id="np-controls"></div>
  </div>
</div>
<div class="player" id="player" hidden>
  <div class="player-in">
    <img class="art" id="p-art" alt="">
    <div class="t" id="p-open"><b id="p-title"></b><span id="p-artist"></span><span class="meta" id="p-tempo"></span></div>
    <div class="controls">
      <span class="slot">
        <button class="round" id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h3.5l7 10H18v-2l3 3-3 3v-2h-4.5l-7-10H4zm10.5 0H18V5l3 3-3 3V9h-3.5l-1.6 2.3-1.2-1.7zM4 17h3.5l1.6-2.3 1.2 1.7L8.5 19H4z"/></svg></button>
        <button class="vote" id="down" aria-label="Not for this playlist" hidden><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="vote" id="up" aria-label="Add to this playlist" hidden><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </span>
      <button class="round" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7zM5 5h3v14H5z"/></svg></button>
      <button class="round primary" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="round" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
    </div>
    <div class="seek"><span id="pos">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position"><span id="dur">0:00</span>
      <input type="range" class="volume" id="volume" min="0" max="100" value="100" aria-label="Volume"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const PID = Number(location.pathname.split("/").pop());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (s) => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

async function api(path, body, method) {
  const res = await fetch(path, body === undefined && !method ? {} : {
    method: method || "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body ?? {}),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}
// After changes made on the page (shown at once), the server's view is fetched once things go quiet: the list
// re-orders then, not under my finger while I'm still tapping stars.
let settleTimer = null;
function settleLater(ms = 1500) {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => { load(); loadFind(); }, ms);
}
// A menu always opens downwards (feedback #40, 2026-11-11: upwards looked wrong). If it would run under the player
// bar, the page scrolls up just enough to show all of it, with room added below the list when there isn't enough.
function placeMenu(m) {
  const bar = document.body.classList.contains("mh-now-on") ? 150 : ($("player").hidden || getComputedStyle($("player")).display === "none")
    ? 8 : $("player").offsetHeight + 16;              // (in the browser shell its bar covers the bottom instead)
  const bottom = innerHeight - bar;
  m.style.maxHeight = `${Math.max(160, bottom - 24)}px`;
  // Kept inside the screen sideways too (feedback #52: on a phone the playlist's ⋯ menu ran off the right edge,
  // widening the page and pushing the player out of place).
  const r0 = m.getBoundingClientRect(), edge = document.documentElement.clientWidth - 8;
  if (r0.right > edge) m.style.transform = `translateX(${-Math.ceil(r0.right - edge)}px)`;
  else if (r0.left < 8) m.style.transform = `translateX(${Math.ceil(8 - r0.left)}px)`;
  const over = m.getBoundingClientRect().bottom - bottom;
  if (over <= 0) return;
  const room = $("menu-room"), short = scrollY + innerHeight + over - document.documentElement.scrollHeight;
  if (short > 0) room.style.height = `${room.offsetHeight + short}px`;   // kept: removing it would jump the page
  window.scrollBy({top: over, behavior: "smooth"});
}
function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }

let data = null, timer = null, sortOrder = null;          // sortOrder: {title, ids} while sorted by sound

// Rows are kept and reused while their content is unchanged, so a star or a play redraws one row, not the list
// (re-creating every row reloaded its cover and felt sluggish).
const rowCache = new Map();                               // html -> element
function fill(ol, html) {
  const els = html.map((h) => {
    let el = rowCache.get(h);
    if (!el) {
      const tpl = document.createElement("template"); tpl.innerHTML = h.trim();
      el = tpl.content.firstElementChild; rowCache.set(h, el);
    }
    return el;
  });
  // Moved into place one by one (not emptied and refilled: the list collapsing for a moment threw the page back up).
  els.forEach((el, i) => { if (ol.children[i] !== el) ol.insertBefore(el, ol.children[i] || null); });
  while (ol.children.length > els.length) ol.lastElementChild.remove();
  if (rowCache.size > 600) rowCache.clear();              // (old versions of rows)
}
// The playlist's order, as the server keeps it (library.playlist_tracks): To rate first, newest first; then by stars,
// 5 at the top, unstarred last; the same stars, the most recently starred first. Used to move a starred track at once.
// Redraw without the page moving: a row on screen (not the one being moved) stays exactly where it was.
function keepView(except, redraw) {
  const ref = [...document.querySelectorAll("li[data-row]")].find((r) => {
    if (r === except) return false;
    const b = r.getBoundingClientRect();
    return b.top >= 0 && b.bottom <= innerHeight;
  });
  const before = ref ? ref.getBoundingClientRect().top : 0, id = ref && ref.dataset.row;
  redraw();
  const now = id && document.querySelector(`li[data-row="${id}"]`);   // (redrawn rows are new elements)
  if (now) window.scrollBy(0, now.getBoundingClientRect().top - before);
}
const nowStamp = () => new Date().toISOString().replace("T", " ").slice(0, 23);
function sortTracks(list) {
  const added = (t) => t.status === "added";
  const cmp = (a, b) => a < b ? 1 : a > b ? -1 : 0;              // newest / largest first
  return [...list].sort((a, b) =>
    (added(b) - added(a))
    || (added(a) && added(b) ? cmp(a.added_at || "", b.added_at || "") : 0)
    || ((a.stars == null) - (b.stars == null))
    || ((b.stars || 0) - (a.stars || 0))
    || ((a.position != null) - (b.position != null))                // not yet placed by hand: on top of its stars
    || ((a.position ?? 0) - (b.position ?? 0))                       // then in the order I dragged them into
    || cmp(a.starred_at || a.added_at || "", b.starred_at || b.added_at || "")
    || cmp(a.added_at || "", b.added_at || "")
    || (b.id - a.id));
}
// The playlist as last seen is kept on this device and shown at once on opening; fresh data follows.
const CACHE_KEY = `playlist:${PID}`;
function cached() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; } }
function keep(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {} }

function stars(t) {
  return `<span class="stars" role="group" aria-label="Stars">${[1, 2, 3, 4, 5].map((n) =>
    `<button class="${t.stars && n <= t.stars ? "on" : ""}" data-star="${n}" data-track="${t.id}"
      aria-label="${n} star${n > 1 ? "s" : ""}${t.stars === n ? " (tap again to clear)" : ""}">★</button>`).join("")}</span>`;
}
const passes = (t) => !data.min_stars || (t.stars || 0) >= data.min_stars;   // Play / Shuffle's star filter
function row(t) {
  const playing = queue[pos] && queue[pos].id === t.id;
  return `<li data-row="${t.id}" data-stars="${t.stars || 0}" class="${playing ? "playing" : ""} ${t.audio ? "" : "unavailable"} ${passes(t) ? "" : "filtered"}">
    <button class="cover-btn" data-play="${t.id}" aria-label="Play ${esc(t.title)}" ${t.audio ? "" : "disabled"}>
      ${t.art ? `<img src="${t.art}" alt="" loading="lazy">` : "♪"}</button>
    <div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span>
      <span class="sub">${t.audio ? `${fmt(t.duration_s)}${t.bpm_shown ? ` • ${t.bpm_shown}` : ""}${t.bpm_override ? ` → ${t.bpm_override}` : ""}` : rowStatus(t)}</span></div>
    ${stars(t)}
    <div class="more"><button data-more="${t.id}" aria-label="More for ${esc(t.title)}" aria-expanded="false">⋯</button></div>
  </li>`;
}

// What an import is doing right now, and for how long: "BETH – Keep It Movin' · downloading and analysing on the PC
// · 0:42". The clock restarts whenever the step changes, so a step that sits for many minutes stands out as stuck.
let stepSeen = {text: null, at: 0};
// Just the song and the clock (the step is left out, my note): "BETH – Keep It Movin' · 0:42". The clock counts from
// when the song started, so one sitting for many minutes stands out.
function stepLine(message) {
  if (!message || message === "Done" || message === "Reading Spotify") return "";
  const name = message.split(": ")[0];
  if (name !== stepSeen.text) stepSeen = {text: name, at: Date.now()};
  return `${name} · ${clock()}`;
}
function clock() {
  const s = Math.floor((Date.now() - stepSeen.at) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
// A greyed song (no audio yet) says where it is: being downloaded now (with the step and clock), waiting its turn, or
// without audio (when nothing is fetching it).
// An import or add started elsewhere (another device, the home page, a refresh) shows up here within a few seconds.
setInterval(async () => {
  const busy = (j) => j && (j.state === "queued" || j.state === "running");
  if (!data || busy(data.job) || document.hidden) return;              // (while busy, load() keeps checking)
  try { const r = await api(`/api/playlists/${PID}/job`); if (busy(r.job)) load(); } catch (e) {}
}, 5000);
function rowStatus(t) {
  const job = data && data.job, active = job && (job.state === "queued" || job.state === "running");
  if (!active) return "No audio";
  const msg = (job.progress && job.progress.message) || "", name = `${t.artist} – ${t.title}`;
  if (msg.startsWith(name)) return `<span class="row-step">Downloading now</span>`;
  return "Waiting to download";
}
setInterval(() => {
  const el = document.getElementById("import-step");
  if (el && stepSeen.text) el.textContent = stepLine(stepSeen.text);
}, 1000);
function render() {
  if (typeof RowDrag !== "undefined" && RowDrag.busy()) return;   // not under a row being dragged
  const d = data;
  document.title = `${d.name} · Music Hunter`;
  $("name").textContent = d.name;
  $("desc").textContent = d.description || ""; $("desc").hidden = !d.description;
  if ($("cover").dataset.src !== (d.image || "")) {
    $("cover").dataset.src = d.image || "";
    $("cover").innerHTML = d.image ? `<img src="${d.image}" alt="">` : esc((d.name || "?")[0].toUpperCase());
    Tint.apply(d.image);                                   // the page's glow and accent from the cover
  }
  const n = (k) => `${k} track${k === 1 ? "" : "s"}`;
  const secs = d.tracks.reduce((a, t) => a + (t.duration_s || 0), 0), mins = Math.round(secs / 60);
  const total = mins >= 60 ? `${Math.floor(mins / 60)} hr ${mins % 60} min` : `${mins} min`;   // like Spotify
  $("counts").textContent = n(d.tracks.length) + ` · ${total}` + (d.tempo && d.tempo.target ? ` · ${Math.round(d.tempo.target)} BPM` : "");
  $("min-stars").value = String(d.min_stars || 0);
  $("min-stars").classList.toggle("on", !!d.min_stars);
  const sorted = sortOrder && sortOrder.ids;
  $("sortbar").hidden = !sorted;
  if (sorted) {                                            // one list, closest-sounding first (To rate included)
    const at = new Map(sortOrder.ids.map((id, i) => [id, i]));
    const all = [...d.tracks].sort((a, b) => (at.get(a.id) ?? 1e9) - (at.get(b.id) ?? 1e9));
    $("sort-name").textContent = sortOrder.title;
    $("added-section").hidden = true;
    $("tracks-count").textContent = n(all.length);
    fill($("tracks"), all.map(row));
  } else {
    // Songs without their audio yet (being imported, or waiting) sit in their own list below the rest.
    const ready = d.tracks.filter((t) => t.audio), waiting = d.tracks.filter((t) => !t.audio);
    const added = ready.filter((t) => t.status === "added"), main = ready.filter((t) => t.status !== "added");
    const job = d.job, busy = job && (job.state === "queued" || job.state === "running");
    $("pending-section").hidden = !waiting.length;
    $("pending-label").firstChild.textContent = busy ? "Downloading " : "No audio ";
    $("pending-count").textContent = n(waiting.length);
    fill($("pending"), waiting.map(row));
    $("added-count").textContent = n(added.length);
    $("tracks-count").textContent = main.length ? n(main.length) : "";
    $("added-section").hidden = !added.length;
    fill($("added"), added.map(row));
    fill($("tracks"), main.length ? main.map(row) : [`<li class="empty" style="display:block">No tracks yet.</li>`]);
  }
  const del = d.deleted || [];
  $("deleted-section").hidden = !del.length;
  $("deleted-label").textContent = `Recently deleted (${del.length})`;
  $("deleted").innerHTML = del.map((t) => {
    const days = Math.floor((Date.now() - Date.parse(t.deleted_at.replace(" ", "T") + "Z")) / 864e5);
    const playing = queue[pos] && queue[pos].id === t.id && queue[pos].deleted;
    return `<li data-deleted-play="${t.id}" class="${playing ? "playing" : ""} ${t.audio ? "" : "unavailable"}">
      <div class="art">${t.art ? `<img class="art" src="${t.art}" alt="">` : ""}</div>
      <div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span>
        <span class="sub">${t.stars ? "★".repeat(t.stars) + " • " : ""}${days ? `${days} day${days > 1 ? "s" : ""} ago` : "today"}</span></div>
      <div class="acts"><button data-restore="${t.id}">Restore</button>
        <button data-forever="${t.id}" style="color:var(--bad)">Delete</button></div></li>`;
  }).join("");
  const job = d.job, active = job && (job.state === "queued" || job.state === "running");
  const fails = (job && job.progress && job.progress.failures) || [];
  $("importing").hidden = !active;                 // progress at the top; what couldn't be imported at the bottom
  if (active) {
    const p = job.progress || {}, pct = p.total ? Math.round(100 * p.done / p.total) : 0;
    $("importing").innerHTML = `<div class="label">${job.state === "queued" ? "Waiting to import" : `Importing ${p.done} of ${p.total || "?"}`}</div>
        <div class="bar live" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
        <div class="meta" id="import-step">${esc(stepLine(p.message))}</div>`;
  }
  // Downloads that failed (e.g. YouTube refusing for a while) can be tried again; tracks already imported are kept.
  const retryable = job && (job.kind === "import" || job.kind === "add") && !active
    && (job.state === "failed" || fails.some((f) => /^(download|analysis) failed/.test(f.reason)));
  $("job").hidden = !(fails.length || (job && job.state === "failed"));
  if (!$("job").hidden) {
    $("job").innerHTML = (job.state === "failed" ? `<div class="error">Import stopped: ${esc(job.error)}</div>` : "")
      + (fails.length ? `<details class="failures"><summary>${fails.length} track${fails.length > 1 ? "s" : ""} couldn't be imported</summary>
          <ul>${fails.map((f) => `<li style="display:block;border:0;padding:2px 0;cursor:default">${esc(f.artist)} – ${esc(f.title)}: ${esc(f.reason)}</li>`).join("")}</ul></details>` : "")
      + (retryable ? `<button class="btn" id="retry-import">Try again</button>` : "");
    if (retryable) $("retry-import").onclick = async () => {
      try {
        if (job.kind === "add") await api(`/api/playlists/${PID}/add`, {link: job.payload_link || ""});
        else await api(`/api/playlists/${PID}/import`, {});
      } catch (e) { showError(`Couldn't start the import: ${e.message}`); }
      load();
    };
  }
  clearTimeout(timer);
  if (active) timer = setTimeout(load, 3000);
}

async function load() {
  try { data = await api(`/api/playlists/${PID}`); keep(data); keepView(null, render); }
  catch (e) { showError(`Couldn't load the playlist: ${e.message}`); }
}

// --- Find music (SPEC.md §18.2): first time confirm → progress → Ready; after that it opens the interface ----
let findTimer = null, find = null;
async function loadFind() {
  try { find = await api(`/api/playlists/${PID}/find`); } catch (e) { return; }
  const btn = $("find"), box = $("find-status");
  clearTimeout(findTimer);
  if (find.state === "none") {
    btn.disabled = !find.seeds;
    btn.textContent = "Find music";
    btn.title = find.seeds ? "" : "Add a song first";
    box.hidden = true;
    box.innerHTML = "";
  } else if (find.state === "preparing") {
    btn.disabled = true; btn.textContent = "Preparing…";
    const pct = Math.min(100, Math.round(100 * find.playable / find.early_start));
    box.hidden = false;
    box.innerHTML = `<div class="label">Finding music · ${find.playable} of ${find.early_start} tracks ready to start</div>
      <div class="bar live" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      ${find.message ? `<div class="meta">${esc(find.message)}</div>` : ""}`;
    findTimer = setTimeout(loadFind, 3000);
  } else if (find.state === "error") {
    btn.disabled = false; btn.textContent = "Try again";
    box.hidden = false; box.innerHTML = `<div class="error">Find music stopped: ${esc(find.message)}</div>`;
  } else {
    btn.disabled = false; btn.textContent = "Find music";
    box.hidden = true; box.innerHTML = "";
  }
  btn.classList.toggle("ready", find.state === "ready");
  btn.classList.toggle("on", !!fm);
}
$("find").addEventListener("click", async () => {
  if (!find) return;
  if (find.state === "ready") { fm ? Find.leave() : Find.start(); return; }
  if (find.state === "none" && !await ask(`Find music for "${data.name}"?`, {ok: "Find music",
      detail: `New tracks are found from your ${find.seeds} ${find.starred ? "starred " : ""}track${find.seeds > 1 ? "s" : ""}, `
        + `downloaded and analysed: a few minutes before the first ${find.early_start} are ready; the rest keep coming in the background.`})) return;
  try { await api(`/api/playlists/${PID}/find`, {}); } catch (e) { showError(`Couldn't start Find music: ${e.message}`); }
  loadFind();
});

// --- track actions ---------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  const star = e.target.closest("[data-star]");
  if (star) {
    const tid = Number(star.dataset.track), n = Number(star.dataset.star);
    const t = data.tracks.find((x) => x.id === tid);
    const stars = t.stars === n ? null : n;
    // Shown and moved into place at once (the server does the same and catches up behind); the page stays where it
    // is: the moving row isn't used to hold the scroll position, so the view doesn't follow it.
    t.stars = stars; t.starred_at = nowStamp(); t.position = null;
    if (stars != null) t.status = "member";             // a starred To rate track joins the list
    data.tracks = sortTracks(data.tracks);
    keepView(star.closest("li"), render);
    try { await api(`/api/playlists/${PID}/tracks/${tid}`, {stars}, "PUT"); settleLater(4000); }
    catch (err) { showError(`Couldn't save the stars: ${err.message}`); load(); }
    return;
  }
  const delRow = e.target.closest("[data-deleted-play]");
  if (delRow && !e.target.closest(".acts")) {
    const list = (data.deleted || []).filter((t) => t.audio).map((t) => ({...t, deleted: true}));
    const i = list.findIndex((t) => t.id === Number(delRow.dataset.deletedPlay));
    if (i < 0) return;
    if (queue[pos] && queue[pos].deleted && queue[pos].id === list[i].id) { if (audio.paused) audio.play().catch(() => {}); return; }
    queue = list.slice(i); pos = 0; playAt(0);
    return;
  }
  const play = e.target.closest("[data-play]");
  if (play) { playTrack(Number(play.dataset.play)); return; }
  const rowEl = e.target.closest("li[data-row]");
  if (rowEl && !e.target.closest(".stars, .more, .menu")) {
    document.querySelectorAll(".menu").forEach((m) => m.remove());
    const t = data.tracks.find((x) => x.id === Number(rowEl.dataset.row));
    if (t && t.audio) playTrack(t.id);
    return;
  }
  const plMore = e.target.closest("#pl-more");
  const more = e.target.closest("[data-more]");
  if (e.target.closest(".menu [data-pl-action], .menu [data-pl-toggle]")) return;   // handled below
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  if (plMore) {
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.innerHTML = `<button data-pl-action="details">Edit details</button>
      <button data-pl-action="picture">${data.image ? "Change picture" : "Add picture"}</button>
      <button data-pl-action="folder">${data.folder_id ? "Move to another folder" : "Move to folder"}</button>`
      + (data.can_refresh ? `<button data-pl-action="refresh">Refresh from Spotify</button>` : "")
      + (Phone ? `<button data-pl-toggle="download"></button>` : "") + `<button data-pl-toggle="sync"></button>`
      + `<button data-pl-action="results">Results</button>`
      + (data.others.length ? `<button data-pl-action="merge">Merge into…</button>` : "") + `<hr>
      <button data-pl-action="delete" style="color:var(--bad)">Delete playlist</button>`;
    plMore.parentElement.appendChild(menu);
    renderToggles();
    placeMenu(menu);
    return;
  }
  if (more) {
    const tid = Number(more.dataset.more);
    const menu = document.createElement("div");
    menu.className = "menu";
    const tt = data.tracks.find((x) => x.id === tid);
    menu.innerHTML = `<button data-sheet="${tid}">Add to playlist…</button>`
      + `<button data-queue="${tid}">Add to queue</button>`
      + `<button data-sound="${tid}">Sort by sound like this</button>`
      + `<button data-similar="${tid}">Find similar</button>`
      + (tt && tt.art ? `<button data-cover-from="${tid}">Use as playlist cover</button>` : "")
      + `<button data-own-bpm="${tid}">Play at … BPM</button>`
      + `<hr><button data-remove="${tid}" style="color:var(--bad)">Remove from this playlist</button>`;
    more.parentElement.appendChild(menu);
    placeMenu(menu);
    return;
  }
  const q = e.target.closest("[data-queue]");
  if (q) { const t = data.tracks.find((x) => x.id === Number(q.dataset.queue)); if (t && t.audio) addToQueue(t); return; }
  const sheet = e.target.closest("[data-sheet]");
  if (sheet) { openSheet(Number(sheet.dataset.sheet)); return; }
  const sound = e.target.closest("[data-sound]");
  if (sound) {
    const tid = Number(sound.dataset.sound), t = data.tracks.find((x) => x.id === tid);
    try {
      const r = await api(`/api/playlists/${PID}/sound-order/${tid}`);
      sortOrder = {title: t ? t.title : "", ids: r.order};
      render();
      window.scrollTo({top: $("sortbar").offsetTop - 12, behavior: "smooth"});
    } catch (err) { showError(`Couldn't sort: ${err.message}`); }
    return;
  }
  const coverFrom = e.target.closest("[data-cover-from]");
  if (coverFrom) {
    try { await api(`/api/playlists/${PID}/cover/track/${coverFrom.dataset.coverFrom}`, {}); await load(); }
    catch (err) { showError(`Couldn't use that cover: ${err.message}`); }
    return;
  }
  const mergeInto = e.target.closest("[data-merge-into]");
  if (mergeInto) {
    const to = data.others.find((o) => o.id === Number(mergeInto.dataset.mergeInto));
    if (!await ask(`Merge "${data.name}" into "${to.name}"?`, {ok: "Merge", danger: true,
        detail: `Its songs join "${to.name}" (a song in both keeps the higher stars), then "${data.name}" and its Find music are deleted.`})) return;
    try { await api(`/api/playlists/${PID}/merge`, {into: to.id}); go(`/playlist/${to.id}`); }
    catch (err) { showError(`Couldn't merge: ${err.message}`); }
    return;
  }
  const folderPick = e.target.closest("[data-folder-pick]");
  if (folderPick) {
    let fid = folderPick.dataset.folderPick;
    try {
      if (fid === "new") {
        const name = await askText("New folder", {placeholder: "Folder name", ok: "Create"});
        if (!name) return;
        fid = (await api("/api/folders", {name})).folder_id;
      }
      await api(`/api/playlists/${PID}/folder`, {folder_id: fid === "none" ? null : Number(fid)}, "PUT");
      await load();
    } catch (err) { showError(`Couldn't move it: ${err.message}`); }
    return;
  }
  const similar = e.target.closest("[data-similar]");
  if (similar) {
    try {
      const r = await api(`/api/tracks/${similar.dataset.similar}/similar`, {});
      go(`/playlist/${r.playlist_id}`);

    void art.offsetWidth;
    art.classList.add("slide"); art.style.transform = ""; art.style.opacity = "";
  }
  function canGo(dir) {
    if (fm) return true;
    return dir > 0 ? pos + 1 < queue.length : pos > 0;
  }
  async function go(dir) {                                // dir 1: next, -1: previous (never just a restart)
    if (fm) return dir > 0 ? $("next").click() : Find.back(true);
    return playAt(pos + dir);
  }
  let g = null;
  function down(e) {
    if (e.button || e.target.closest("button, input, a, #np-go")) return;
    g = {x: e.clientX, y: e.clientY, t: performance.now(), axis: null, onArt: !!e.target.closest("#np-stage"), id: e.pointerId};
  }
  function move(e) {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (!g.axis) {
      if (Math.hypot(dx, dy) < 8) return;
      g.axis = Math.abs(dx) > Math.abs(dy) && g.onArt && !busy ? "x" : dy > 0 ? "y" : "none";
      try { np.setPointerCapture(e.pointerId); } catch (err) {}
      if (g.axis === "y") np.classList.add("drag");
      if (g.axis === "x") art.classList.remove("slide");
    }
    if (g.axis === "y") np.style.transform = `translateY(${Math.max(0, dy)}px)`;
    if (g.axis === "x") {
      const resist = canGo(dx < 0 ? 1 : -1) ? 1 : 0.25;  // nothing that way: it gives a little, then springs back
      art.style.transform = `translateX(${dx * resist}px) rotate(${dx * resist / 60}deg)`;
    }
  }
  function up(e) {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y, v = (g.axis === "x" ? Math.abs(dx) : dy) / Math.max(1, performance.now() - g.t);
    const axis = g.axis; g = null;
    if (axis === "y") {
      np.classList.remove("drag");
      if (dy > 140 || (dy > 40 && v > 0.6)) hide(); else np.style.transform = "";
    } else if (axis === "x") {
      const dir = dx < 0 ? 1 : -1, w = art.offsetWidth + 40;
      art.classList.add("slide");
      if ((Math.abs(dx) > art.offsetWidth * 0.28 || (Math.abs(dx) > 40 && v > 0.5)) && canGo(dir)) {
        busy = true;
        art.style.transform = `translateX(${-dir * w}px) rotate(${-dir * 6}deg)`; art.style.opacity = "0";
        setTimeout(async () => {
          try { await go(dir); } catch (err) {}
          shownKey = (current() || {}).key ?? null; paint();
          slideIn(dir); busy = false;
        }, 200);
      } else art.style.transform = "";
    }
  }
  np.addEventListener("pointerdown", down);
  np.addEventListener("pointermove", move);
  np.addEventListener("pointerup", up);
  np.addEventListener("pointercancel", up);
  $("np-close").addEventListener("click", () => hide());
  np.addEventListener("click", (e) => {
    const b = e.target.closest("[data-np]");
    if (b) {
      if (b.dataset.np === "next") enterFrom = 1; else if (b.dataset.np === "prev") enterFrom = -1;
      document.getElementById(b.dataset.np).click(); setTimeout(paint, 150); return;
    }
    if (e.target.closest("#np-go")) {                     // to the song in the list
      const c = current(), t = c && inPlaylist(c);
      if (solo) {                                         // opened over another page: this page comes on screen
        if (bridge && bridge.npOpen) bridge.npOpen(); else if (window.__npFocus) window.__npFocus();
      }
      hide(true);
      const row = t && document.querySelector(`li[data-row="${t.id}"]`);
      if (row) { row.scrollIntoView({behavior: "smooth", block: "center"}); row.classList.remove("found"); void row.offsetWidth; row.classList.add("found"); }
    }
  });
  $("np-seek").addEventListener("input", () => { seeking = true; });
  $("np-seek").addEventListener("change", () => { const d = audio.duration || 0; if (d) audio.currentTime = d * $("np-seek").value / 1000; seeking = false; });
  document.addEventListener("keydown", (e) => { if (open && e.key === "Escape") hide(); });
  return {show, hide, isOpen: () => open};
})();

window.feedbackContext = () => {
  if (fm && fm.cur) return {playlist_id: PID, play_id: Find.onAir().play_id, track_id: Find.onAir().track_id,
                            position_s: Math.round(audio.currentTime || 0)};
  const t = queue[pos];
  return {playlist_id: PID, track_id: t ? t.id : null, position_s: Math.round(audio.currentTime || 0)};
};
$("add-song").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { await api(`/api/playlists/${PID}/add`, {link: $("add-link").value}); $("add-link").value = ""; load(); }
  catch (err) { showError(err.message); }
});
{ const c = cached(); if (c) { data = c; render(); renderTempo(); } }   // as last seen, at once
load().then(renderTempo).then(async () => {                 // opened to carry on (the app restarting, #60)
  const last = Last.get();
  if (!new URLSearchParams(location.search).has("resume") || !last || last.pid !== PID || pos >= 0 || fm) return;
  if (last.mode === "find") { if (!find) await loadFind(); if (find && find.state === "ready") Find.start(false); return; }
  if (data.tracks.some((t) => t.id === last.track_id && t.audio)) startQueue(last.track_id, false);
});
loadFind();
</script>
<script src="/static/feedback.js"></script>
