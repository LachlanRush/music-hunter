<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playlist · Music Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/tempo.js"></script>
<script src="/static/media.js"></script>
<script src="/static/shuffle.js"></script>
<style>
body { padding-bottom: 140px; }
.head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: end; }
.cover { width: 120px; height: 120px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center; overflow: hidden; font: 800 42px var(--display); color: var(--muted); }
.cover img { width: 100%; height: 100%; object-fit: cover; }
h1 { font: 800 clamp(26px, 5vw, 40px)/1.05 var(--display); font-stretch: 112%; margin: 4px 0; overflow-wrap: anywhere; }
.meta { font: 400 12px/1.4 var(--mono); color: var(--muted); }
h2 .meta { text-transform: none; letter-spacing: normal; margin-left: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font: 600 14px var(--body); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.danger { color: var(--bad); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
#job { display: grid; gap: 10px; justify-items: start; }
h2 { font: 700 13px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
ol { list-style: none; margin: 0; padding: 0; display: grid; }
li { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--line); }
li.playing .t b { color: var(--accent); }
li.unavailable { opacity: .5; }
.art { width: 40px; height: 40px; border-radius: 4px; background: var(--surface); object-fit: cover; }
.cover-btn { width: 40px; height: 40px; padding: 0; border: 0; border-radius: 4px; background: var(--surface);
  overflow: hidden; display: grid; place-items: center; color: var(--muted); }
.cover-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-btn:disabled { cursor: default; }
li.playing .cover-btn { outline: 2px solid var(--accent); outline-offset: 1px; }
.t { min-width: 0; }
.t b { display: block; font: 600 14px/1.3 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t span.sub { font: 400 12px/1.3 var(--mono); }
.stars { display: flex; gap: 6px; margin-left: 16px; }
.stars button { border: 0; background: none; padding: 4px 2px; font-size: 26px; line-height: 1; color: var(--line); }
.stars button.on { color: var(--accent); }
.more, .pl-menu { position: relative; }
.more > button { border: 0; background: none; font-size: 20px; padding: 2px 6px; color: var(--muted); }
.menu { position: absolute; right: 0; top: 100%; z-index: 5; min-width: 200px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
.menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 4px; font-size: 14px; }
.menu button:hover { background: var(--bg); }
.menu .label { padding: 6px 10px 2px; }
.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.player-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.player .art { width: 44px; height: 44px; }
.player .art, .player .t { cursor: pointer; }
li.found { animation: found 1.2s ease-out; }
@keyframes found { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
.controls { display: flex; gap: 6px; align-items: center; }
.round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; }
.round svg { width: 15px; height: 15px; fill: currentColor; }
.round.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.round.on { border-color: var(--accent); color: var(--accent); }
.seek { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center;
  font: 400 11px var(--mono); color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.empty { color: var(--muted); }
.add-song { display: flex; gap: 8px; }
.add-song input { flex: 1 1 auto; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--fg); font: 400 14px var(--body); }
.deleted ol { margin-top: 8px; }
.deleted li { grid-template-columns: 40px minmax(0, 1fr) auto; cursor: default; }
.deleted li:hover { background: none; }
.deleted .acts { display: flex; gap: 6px; }
.deleted .acts button { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font: 500 12px var(--body); color: var(--fg); }
li { margin-inline: -8px; padding-inline: 8px; border-radius: 6px; }
@media (hover: hover) { li[data-row]:not(.unavailable):hover { background: var(--surface); } }
li .cover-btn { cursor: default; }
.btn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.round.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#mh-download { display: none; }                           /* (the button an older app adds; it's in the ⋯ menu now) */
.menu button.off { color: var(--muted); }                 /* Download and Sync while they're off */
.volume { display: none; width: 90px; }
@media (hover: hover) and (pointer: fine) { .volume { display: block; } }
.tempo { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }
.tempo label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.tempo input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.tempo input[type=number] { width: 72px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--fg); font: 500 14px var(--mono); }
.tempo input:disabled { opacity: .45; }
.error { color: var(--bad); font-size: 14px; }
@media (max-width: 520px) {
  li { grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 8px; }
  .stars { gap: 3px; margin-left: 8px; }
  .stars button { font-size: 22px; padding: 4px 1px; }
  .cover { width: 84px; height: 84px; }
}
</style>
</head>
<body>
<main>
  <header>
    <nav><a class="brand" href="/">MUSIC HUNTER</a><a class="backlink" href="/" aria-label="Back to playlists">←</a></nav>
    <div class="status" id="status"></div>
  </header>

  <section class="head">
    <div class="cover" id="cover">?</div>
    <div>
      <h1 id="name">Loading…</h1>
      <div class="meta" id="counts"></div>
    </div>
  </section>

  <section class="actions">
    <button class="btn" id="play-all">Play</button>
    <button class="btn" id="shuffle-all" aria-pressed="false">Shuffle</button>
    <button class="btn" id="find" disabled>Find music</button>
    <div class="pl-menu"><button class="btn" id="pl-more" aria-label="More for this playlist" aria-expanded="false">⋯</button></div>
    <input id="picture" type="file" accept="image/*" hidden>
  </section>

  <section class="tempo" aria-label="Tempo">
    <label><input type="checkbox" id="same-bpm"> Set to</label>
    <label><input type="number" id="bpm-target" min="60" max="200" step="0.5" inputmode="decimal" aria-label="Target BPM"> BPM</label>
    <span class="meta" id="tempo-note"></span>
  </section>

  <section id="find-status" hidden></section>
  <section id="importing" hidden></section>
  <div class="error" id="error" hidden></div>

  <section id="added-section" hidden>
    <h2>To rate <span class="meta" id="added-count"></span></h2>
    <ol id="added"></ol>
  </section>
  <section>
    <h2 id="tracks-label">Tracks <span class="meta" id="tracks-count"></span></h2>
    <ol id="tracks"></ol>
  </section>
  <form class="add-song" id="add-song">
    <input id="add-link" type="url" placeholder="Add a song — Spotify or YouTube Music link" aria-label="Song link" required>
    <button class="btn" type="submit">Add</button>
  </form>
  <section id="job" hidden></section>
  <details class="failures deleted" id="deleted-section" hidden>
    <summary id="deleted-label">Recently deleted</summary>
    <ol id="deleted"></ol>
  </details>
</main>

<div class="player" id="player" hidden>
  <div class="player-in">
    <img class="art" id="p-art" alt="">
    <div class="t" id="p-open"><b id="p-title"></b><span id="p-artist"></span><span class="meta" id="p-tempo"></span></div>
    <div class="controls">
      <button class="round" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7zM5 5h3v14H5z"/></svg></button>
      <button class="round primary" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="play-icon"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="round" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5h3v14h-3z"/></svg></button>
      <button class="round" id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h3.5l7 10H18v-2l3 3-3 3v-2h-4.5l-7-10H4zm10.5 0H18V5l3 3-3 3V9h-3.5l-1.6 2.3-1.2-1.7zM4 17h3.5l1.6-2.3 1.2 1.7L8.5 19H4z"/></svg></button>
    </div>
    <div class="seek"><span id="pos">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position"><span id="dur">0:00</span>
      <input type="range" class="volume" id="volume" min="0" max="100" value="100" aria-label="Volume"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const PID = Number(location.pathname.split("/").pop());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (s) => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

async function api(path, body, method) {
  const res = await fetch(path, body === undefined && !method ? {} : {
    method: method || "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body ?? {}),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}
function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }

let data = null, timer = null;

function stars(t) {
  return `<span class="stars" role="group" aria-label="Stars">${[1, 2, 3, 4, 5].map((n) =>
    `<button class="${t.stars && n <= t.stars ? "on" : ""}" data-star="${n}" data-track="${t.id}"
      aria-label="${n} star${n > 1 ? "s" : ""}${t.stars === n ? " (tap again to clear)" : ""}">★</button>`).join("")}</span>`;
}
function row(t) {
  const playing = queue[pos] && queue[pos].id === t.id;
  return `<li data-row="${t.id}" class="${playing ? "playing" : ""} ${t.audio ? "" : "unavailable"}">
    <button class="cover-btn" data-play="${t.id}" aria-label="Play ${esc(t.title)}" ${t.audio ? "" : "disabled"}>
      ${t.art ? `<img src="${t.art}" alt="" loading="lazy">` : "♪"}</button>
    <div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span>
      <span class="sub">${fmt(t.duration_s)}${t.bpm_shown ? ` • ${t.bpm_shown}` : ""}${t.bpm_override ? ` → ${t.bpm_override}` : ""}</span></div>
    ${stars(t)}
    <div class="more"><button data-more="${t.id}" aria-label="More for ${esc(t.title)}" aria-expanded="false">⋯</button></div>
  </li>`;
}

function render() {
  const d = data;
  document.title = `${d.name} · Music Hunter`;
  $("name").textContent = d.name;
  $("cover").innerHTML = d.image ? `<img src="${d.image}" alt="">` : esc((d.name || "?")[0].toUpperCase());
  const n = (k) => `${k} track${k === 1 ? "" : "s"}`;
  $("counts").textContent = n(d.tracks.length);
  const added = d.tracks.filter((t) => t.status === "added"), main = d.tracks.filter((t) => t.status !== "added");
  $("added-count").textContent = n(added.length);
  $("tracks-count").textContent = main.length ? n(main.length) : "";
  $("added-section").hidden = !added.length;
  $("added").innerHTML = added.map(row).join("");
  $("tracks").innerHTML = main.length ? main.map(row).join("") : `<li class="empty" style="display:block">No tracks yet.</li>`;
  const del = d.deleted || [];
  $("deleted-section").hidden = !del.length;
  $("deleted-label").textContent = `Recently deleted (${del.length})`;
  $("deleted").innerHTML = del.map((t) => {
    const days = Math.floor((Date.now() - Date.parse(t.deleted_at.replace(" ", "T") + "Z")) / 864e5);
    return `<li><div class="art">${t.art ? `<img class="art" src="${t.art}" alt="">` : ""}</div>
      <div class="t"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span>
        <span class="sub">${t.stars ? "★".repeat(t.stars) + " • " : ""}${days ? `${days} day${days > 1 ? "s" : ""} ago` : "today"}</span></div>
      <div class="acts"><button data-restore="${t.id}">Restore</button>
        <button data-forever="${t.id}" style="color:var(--bad)">Delete</button></div></li>`;
  }).join("");
  const job = d.job, active = job && (job.state === "queued" || job.state === "running");
  const fails = (job && job.progress && job.progress.failures) || [];
  $("importing").hidden = !active;                 // progress at the top; what couldn't be imported at the bottom
  if (active) {
    const p = job.progress || {}, pct = p.total ? Math.round(100 * p.done / p.total) : 0;
    $("importing").innerHTML = `<div class="label">${job.state === "queued" ? "Waiting to import" : `Importing ${p.done} of ${p.total || "?"}`}</div>
        <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
  }
  // Downloads that failed (e.g. YouTube refusing for a while) can be tried again; tracks already imported are kept.
  const retryable = job && (job.kind === "import" || job.kind === "add") && !active
    && (job.state === "failed" || fails.some((f) => /^(download|analysis) failed/.test(f.reason)));
  $("job").hidden = !(fails.length || (job && job.state === "failed"));
  if (!$("job").hidden) {
    $("job").innerHTML = (job.state === "failed" ? `<div class="error">Import stopped: ${esc(job.error)}</div>` : "")
      + (fails.length ? `<details class="failures"><summary>${fails.length} track${fails.length > 1 ? "s" : ""} couldn't be imported</summary>
          <ul>${fails.map((f) => `<li style="display:block;border:0;padding:2px 0;cursor:default">${esc(f.artist)} – ${esc(f.title)}: ${esc(f.reason)}</li>`).join("")}</ul></details>` : "")
      + (retryable ? `<button class="btn" id="retry-import">Try again</button>` : "");
    if (retryable) $("retry-import").onclick = async () => {
      try {
        if (job.kind === "add") await api(`/api/playlists/${PID}/add`, {link: job.payload_link || ""});
        else await api(`/api/playlists/${PID}/import`, {});
      } catch (e) { showError(`Couldn't start the import: ${e.message}`); }
      load();
    };
  }
  clearTimeout(timer);
  if (active) timer = setTimeout(load, 3000);
}

async function load() {
  try { data = await api(`/api/playlists/${PID}`); render(); }
  catch (e) { showError(`Couldn't load the playlist: ${e.message}`); }
}

// --- Find music (SPEC.md §18.2): first time confirm → progress → Ready; after that it opens the interface ----
let findTimer = null, find = null;
async function loadFind() {
  try { find = await api(`/api/playlists/${PID}/find`); } catch (e) { return; }
  const btn = $("find"), box = $("find-status");
  clearTimeout(findTimer);
  if (find.state === "none") {
    btn.disabled = !find.seeds;
    btn.textContent = "Find music";
    btn.title = find.seeds ? "" : "Star at least one track first — starred tracks are the seeds";
    box.hidden = true;
    box.innerHTML = "";
  } else if (find.state === "preparing") {
    btn.disabled = true; btn.textContent = "Preparing…";
    const pct = Math.min(100, Math.round(100 * find.playable / find.early_start));
    box.hidden = false;
    box.innerHTML = `<div class="label">Finding music · ${find.playable} of ${find.early_start} tracks ready to start</div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`;
    findTimer = setTimeout(loadFind, 3000);
  } else if (find.state === "error") {
    btn.disabled = false; btn.textContent = "Try again";
    box.hidden = false; box.innerHTML = `<div class="error">Find music stopped: ${esc(find.message)}</div>`;
  } else {
    btn.disabled = false; btn.textContent = "Find music";
    box.hidden = true; box.innerHTML = "";
  }
}
$("find").addEventListener("click", async () => {
  if (!find) return;
  if (find.state === "ready") { location.href = `/find/${PID}`; return; }
  if (find.state === "none" && !confirm(`Find music for "${data.name}"?\n\nThis finds and downloads new tracks from your ${find.seeds} starred `
      + `track${find.seeds > 1 ? "s" : ""} and analyses them — a few minutes before the first ${find.early_start} are ready; `
      + "the rest keep coming in the background.")) return;
  try { await api(`/api/playlists/${PID}/find`, {}); } catch (e) { showError(`Couldn't start Find music: ${e.message}`); }
  loadFind();
});

// --- track actions ---------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  const star = e.target.closest("[data-star]");
  if (star) {
    const tid = Number(star.dataset.track), n = Number(star.dataset.star);
    const t = data.tracks.find((x) => x.id === tid);
    const stars = t.stars === n ? null : n;
    t.stars = stars; render();                          // shown at once; the list re-orders when the server answers
    try { await api(`/api/playlists/${PID}/tracks/${tid}`, {stars}, "PUT"); await load(); loadFind(); }
    catch (err) { showError(`Couldn't save the stars: ${err.message}`); load(); }
    return;
  }
  const play = e.target.closest("[data-play]");
  if (play) { playTrack(Number(play.dataset.play)); return; }
  const rowEl = e.target.closest("li[data-row]");
  if (rowEl && !e.target.closest(".stars, .more, .menu")) {
    document.querySelectorAll(".menu").forEach((m) => m.remove());
    const t = data.tracks.find((x) => x.id === Number(rowEl.dataset.row));
    if (t && t.audio) playTrack(t.id);
    return;
  }
  const plMore = e.target.closest("#pl-more");
  const more = e.target.closest("[data-more]");
  if (e.target.closest(".menu [data-pl-action], .menu [data-pl-toggle]")) return;   // handled below
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  if (plMore) {
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.innerHTML = (data.can_refresh ? `<button data-pl-action="refresh">Refresh from Spotify</button>` : "")
      + (Phone ? `<button data-pl-toggle="download"></button>` : "") + `<button data-pl-toggle="sync"></button>`
      + `<button data-pl-action="results">Results</button>
      <button data-pl-action="picture">${data.image ? "Change picture" : "Add picture"}</button>
      <button data-pl-action="rename">Rename</button>
      <button data-pl-action="delete" style="color:var(--bad)">Delete playlist</button>`;
    plMore.parentElement.appendChild(menu);
    renderToggles();
    return;
  }
  if (more) {
    const tid = Number(more.dataset.more);
    const menu = document.createElement("div");
    menu.className = "menu";
    menu.innerHTML = (data.others.length ? `<div class="label">Add to playlist</div>` + data.others.map((o) =>
        `<button data-addto="${o.id}" data-track="${tid}">${esc(o.name)}</button>`).join("") : "")
      + `<button data-own-bpm="${tid}">Play at … BPM</button>`
      + `<button data-similar="${tid}">Find similar</button>`
      + `<button data-remove="${tid}" style="color:var(--bad)">Remove from this playlist</button>`;
    more.parentElement.appendChild(menu);
    return;
  }
  const addto = e.target.closest("[data-addto]");
  if (addto) {
    try {
      const r = await api(`/api/playlists/${addto.dataset.addto}/tracks`, {track_id: Number(addto.dataset.track)});
      $("status").textContent = r.added ? "Added." : "Already in that playlist.";
    } catch (err) { showError(`Couldn't add it: ${err.message}`); }
    return;
  }
  const similar = e.target.closest("[data-similar]");
  if (similar) {
    try {
      const r = await api(`/api/tracks/${similar.dataset.similar}/similar`, {});
      location.href = `/playlist/${r.playlist_id}`;
    } catch (err) { showError(`Couldn't make it: ${err.message}`); }
    return;
  }
  const own = e.target.closest("[data-own-bpm]");
  if (own) {
    const t = data.tracks.find((x) => x.id === Number(own.dataset.ownBpm));
    const v = prompt(`Play "${t.title}" at how many BPM in this playlist? (used instead of Set to BPM while it's on)`,
                     t.bpm_override || t.bpm_shown || "");
    if (v === null || v.trim() === "") return;
    try { await api(`/api/playlists/${PID}/tracks/${t.id}/bpm`, {bpm: Number(v)}, "PUT"); await load(); retuneCurrent(); }
    catch (err) { showError(err.message); }
    return;
  }
  const restore = e.target.closest("[data-restore]");
  if (restore) {
    try { await api(`/api/playlists/${PID}/deleted/${restore.dataset.restore}/restore`, {}); await load(); }
    catch (err) { showError(`Couldn't restore it: ${err.message}`); }
    return;
  }
  const forever = e.target.closest("[data-forever]");
  if (forever) {
    const t = (data.deleted || []).find((x) => x.id === Number(forever.dataset.forever));
    if (!confirm(`Delete "${t ? t.title : "this track"}" for good? It can't be restored.`)) return;
    try { await api(`/api/playlists/${PID}/deleted/${forever.dataset.forever}`, undefined, "DELETE"); await load(); }
    catch (err) { showError(`Couldn't delete it: ${err.message}`); }
    return;
  }
  const remove = e.target.closest("[data-remove]");
  if (remove) {
    try { await api(`/api/playlists/${PID}/tracks/${remove.dataset.remove}`, undefined, "DELETE"); await load(); }
    catch (err) { showError(`Couldn't remove it: ${err.message}`); }
  }
});
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-pl-action]");
  if (!a) return;
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  ({rename: renamePlaylist, delete: deletePlaylist, refresh: refreshPlaylist,
    picture: () => $("picture").click(),
    results: () => { location.href = `/playlist/${PID}/results`; }})[a.dataset.plAction]();
});
$("picture").addEventListener("change", async () => {
  const f = $("picture").files[0];
  if (!f) return;
  try {
    const res = await fetch(`/api/playlists/${PID}/cover`, {method: "POST", body: await f.arrayBuffer()});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || "Couldn't use that picture");
    showError(""); load();
  } catch (e) { showError(e.message); }
  $("picture").value = "";
});
async function renamePlaylist() {
  const name = prompt("Playlist name", data.name);
  if (!name) return;
  await api(`/api/playlists/${PID}`, {name}, "PATCH"); load();
}
async function refreshPlaylist() {
  try { await api(`/api/playlists/${PID}/import`, {}); } catch (e) { showError(`Couldn't refresh: ${e.message}`); }
  load();
}
async function deletePlaylist() {
  if (!confirm(`Delete "${data.name}" for good?\n\nThis can't be undone: the playlist, its stars, its Find music and `
      + "its Recently deleted list are removed, and tracks that are in no other playlist lose their audio.")) return;
  await api(`/api/playlists/${PID}`, undefined, "DELETE"); location.href = "/";
}

// --- player: a normal player (not blind), with shuffle -----------------------------------
const audio = new Audio();
let ctx = null, gainNode = null, queue = [], pos = -1, shuffle = false, seeking = false;

function playable() { return data.tracks.filter((t) => t.audio); }
const round = ShuffleRound.create(PID);                // what's been heard this shuffle round, kept on this device
function playTrack(id) {                               // the track already playing isn't restarted
  if (queue[pos] && queue[pos].id === id) { if (audio.paused) audio.play().catch(() => {}); return; }
  startQueue(id);
}
function startQueue(firstId) {
  let list = playable();
  if (shuffle) list = round.order(list);
  if (firstId != null) {
    const i = list.findIndex((t) => t.id === firstId);
    if (i > 0) list = shuffle ? [list[i], ...list.filter((_, k) => k !== i)] : list.slice(i).concat(list.slice(0, i));
  }
  queue = list; pos = 0;
  if (queue.length) playAt(0);
}
async function playAt(i) {
  pos = i;
  const t = queue[i];
  if (!t) { audio.pause(); return; }
  if (shuffle) round.mark(t.id);
  if (Media.desktop) {                                             // loudness levelling (static/media.js)
    if (!ctx) {
      ctx = new AudioContext(); gainNode = ctx.createGain(); volumeNode = ctx.createGain();
      volumeNode.gain.value = Number($("volume").value) / 100;
      ctx.createMediaElementSource(audio).connect(gainNode).connect(volumeNode).connect(ctx.destination);
    }
    if (ctx.state === "suspended") await ctx.resume();
    gainNode.gain.value = Math.pow(10, (t.gain_db || 0) / 20);
  } else {
    audio.volume = Media.phoneVolume(t.gain_db, data.phone_headroom_db ?? 6);
  }
  Media.metadata({title: t.title, artist: t.artist, album: data.name, art: t.art});
  audio.src = await tempoPlayer.start(t.id, t.audio, fresh(t).rate);
  if (queue[pos] !== t) return;                                   // another track was chosen meanwhile
  const nextT = queue[pos + 1];
  if (nextT) tempoPlayer.prepare(nextT.id, fresh(nextT).rate);    // its copy first in line after this one
  $("player").hidden = false;
  $("p-title").textContent = t.title; $("p-artist").textContent = t.artist;
  $("p-art").src = t.art || ""; $("p-art").style.visibility = t.art ? "visible" : "hidden";
  try { await audio.play(); } catch (e) { setIcon(false); }
  render();
}
function setIcon(on) {
  $("play-all").classList.toggle("on", on);               // filled only while this playlist is playing
  paintShuffleAll(on);
  $("play-icon").innerHTML = on ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 4l13 8-13 8z"/>';
  $("play").setAttribute("aria-label", on ? "Pause" : "Play");
}
audio.addEventListener("play", () => { setIcon(true); Media.playing(true); });
audio.addEventListener("pause", () => { setIcon(false); Media.playing(false); });
audio.addEventListener("loadedmetadata", () => Media.position(audio));
audio.addEventListener("seeked", () => Media.position(audio));
Media.handlers({                                                    // lock screen / notification controls
  play: () => audio.play(), pause: () => audio.pause(),
  nexttrack: () => $("next").click(), previoustrack: () => $("prev").click(),
  seekto: (d) => { audio.currentTime = d.seekTime; Media.position(audio); },
});
audio.addEventListener("ended", () => { if (pos + 1 < queue.length) playAt(pos + 1); });
audio.addEventListener("timeupdate", () => {
  if (seeking) return;
  $("pos").textContent = fmt(audio.currentTime); $("dur").textContent = fmt(audio.duration);
  $("seek").value = audio.duration ? Math.round(1000 * audio.currentTime / audio.duration) : 0;
});
$("seek").addEventListener("input", () => { seeking = true; $("pos").textContent = fmt($("seek").value / 1000 * (audio.duration || 0)); });
$("seek").addEventListener("change", () => { if (audio.duration) audio.currentTime = $("seek").value / 1000 * audio.duration; seeking = false; });
$("play").addEventListener("click", () => {
  if (pos < 0) return startQueue(null);
  audio.paused ? audio.play() : audio.pause();
});
$("next").addEventListener("click", () => { if (pos + 1 < queue.length) playAt(pos + 1); });
// Tapping the playing track (cover or names) shows it in the list (feedback #38).
$("p-art").onclick = $("p-open").onclick = () => {
  const t = queue[pos], row = t && document.querySelector(`li[data-row="${t.id}"]`);
  if (!row) return;
  row.scrollIntoView({behavior: "smooth", block: "center"});
  row.classList.remove("found"); void row.offsetWidth; row.classList.add("found");
};
$("prev").addEventListener("click", () => { audio.currentTime >= (data.back_restart_s ?? 5) || pos === 0 ? (audio.currentTime = 0) : playAt(pos - 1); });
function paintShuffleAll(playing) {                       // like Play: filled only while this playlist is playing, shuffled
  const on = playing && shuffle;
  $("shuffle-all").classList.toggle("on", on); $("shuffle-all").setAttribute("aria-pressed", String(on));
}
function setShuffle(on) {
  shuffle = on;
  round.setOn(on);
  $("shuffle").classList.toggle("on", on); $("shuffle").setAttribute("aria-pressed", String(on));
  paintShuffleAll(pos >= 0 && !audio.paused);
  if (pos >= 0) {                                      // keep the current track, reshuffle (or restore) the rest
    const cur = queue[pos], rest = playable().filter((t) => t.id !== cur.id);
    queue = [cur, ...(shuffle ? round.order(rest) : rest)]; pos = 0;
    if (shuffle) round.mark(cur.id);
  }
}
if (round.on()) setShuffle(true);                      // the mode survives a reload
$("shuffle").addEventListener("click", () => setShuffle(!shuffle));
$("shuffle-all").addEventListener("click", () => {     // not playing: as Play, shuffled; playing: switches the mode
  if (pos >= 0 && !audio.paused) return setShuffle(!shuffle);
  setShuffle(true);
  if (pos < 0) startQueue(null); else audio.play();
});
const playOrPause = () => {                               // Play and the cover
  if (pos < 0) return startQueue(null);
  audio.paused ? audio.play() : audio.pause();
};
$("cover").addEventListener("click", playOrPause);
$("play-all").addEventListener("click", playOrPause);
// Download and Sync, in the ⋯ menu: greyed out while off, then Downloading / Syncing, then Downloaded / Synced.
const Phone = window.NativeAudioBridge || null;           // Download is for the phone app, which stores the files
function downloadState() {
  try { const s = JSON.parse(Phone.offlineState(PID));
        return {on: !!s.on, busy: !!s.on && (s.stored < s.tracks || (s.total > 0 && s.done < s.total))};
  } catch (e) { return {on: false, busy: false}; }
}
function renderToggles() {
  const d = document.querySelector('[data-pl-toggle="download"]'), y = document.querySelector('[data-pl-toggle="sync"]');
  if (d) { const s = downloadState(); d.textContent = !s.on ? "Download" : s.busy ? "Downloading" : "Downloaded"; d.classList.toggle("off", !s.on); }
  if (y && data.sync) { const s = data.sync; y.textContent = !s.on ? "Sync" : s.ready < s.tracks ? "Syncing" : "Synced"; y.classList.toggle("off", !s.on); }
}
setInterval(async () => {                                 // while the menu is open, they follow what's happening
  if (!document.querySelector("[data-pl-toggle]")) return;
  try { data.sync = await api(`/api/playlists/${PID}/sync`); } catch (e) { /* tries again */ }
  renderToggles();
}, 2000);
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-pl-toggle]");
  if (!t) return;
  if (t.dataset.plToggle === "download") {
    const s = downloadState();
    if (s.on && !confirm("Remove this playlist's downloads from the phone? It will still play while you're connected.")) return;
    Phone.offlineSet(PID, !s.on);
  } else {
    try { data.sync = await api(`/api/playlists/${PID}/sync`, {on: !data.sync.on}, "PUT"); }
    catch (err) { showError(`Couldn't change Sync: ${err.message}`); }
  }
  renderToggles();
});

// Volume (computers only; phones use their own buttons), after the loudness levelling.
let volumeNode = null;
try { const v = localStorage.getItem("volume"); if (v !== null) $("volume").value = v; } catch (e) {}
$("volume").addEventListener("input", () => {
  if (volumeNode) volumeNode.gain.value = Number($("volume").value) / 100;
  try { localStorage.setItem("volume", $("volume").value); } catch (e) {}
});
// --- Same BPM (static/tempo.js): stretched copies rendered on the server, shared with this playlist's Find music ---
// The playlist's own Same BPM setting, kept on the server (which renders every track's copy in the background).
const tempoPlayer = SameBpm.player(audio, "", `pl=${PID}`, () => showTempoNote());
const fresh = (t) => (data && data.tracks.find((x) => x.id === t.id)) || t;   // rates change with the setting
function showTempoNote() { $("p-tempo").textContent = queue[pos] ? SameBpm.note(fresh(queue[pos]), tempoPlayer.rate()) : ""; }
function renderTempo() {
  const s = data.tempo;
  $("same-bpm").checked = s.on;
  $("bpm-target").value = s.target;
  $("bpm-target").disabled = !s.on;
}
async function saveTempo(on, bpm) {
  try { await api(`/api/playlists/${PID}/tempo`, {on, bpm}, "PUT"); } catch (e) { showError(`Couldn't save: ${e.message}`); }
  await load();
  renderTempo();
  retuneCurrent();
}
function retuneCurrent() {                              // the playing track follows a new tempo setting
  const t = queue[pos];
  if (t) tempoPlayer.retune(t.id, t.audio, fresh(t).rate);
  showTempoNote();
}
$("same-bpm").addEventListener("change", () => saveTempo($("same-bpm").checked, data.tempo.bpm));
$("bpm-target").addEventListener("change", () => {
  const v = Number($("bpm-target").value);
  saveTempo(true, v >= 60 && v <= 200 ? v : null);
});

window.feedbackContext = () => {
  const t = queue[pos];
  return {playlist_id: PID, track_id: t ? t.id : null, position_s: Math.round(audio.currentTime || 0)};
};
$("add-song").addEventListener("submit", async (e) => {
  e.preventDefault();
  try { await api(`/api/playlists/${PID}/add`, {link: $("add-link").value}); $("add-link").value = ""; load(); }
  catch (err) { showError(err.message); }
});
load().then(renderTempo);
loadFind();
</script>
<script src="/static/feedback.js"></script>
</body>
</html>
