name: Music Hunter
version: "0.5.0"
slug: music_hunter
description: Playlists with stars and Find music; the PC is woken for downloads and analysis
url: https://github.com/LachlanRush/music-hunter
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
homeassistant_api: true
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: Music Hunter web app (also reached over Tailscale)
webui: http://[HOST]:[PORT:8765]/
options:
  worker_token: ""
  lastfm_api_key: ""
  tidal_client_id: ""
  tidal_client_secret: ""
  wake_entity_id: ""
schema:
  worker_token: password
  lastfm_api_key: password
  tidal_client_id: password
  tidal_client_secret: password
  wake_entity_id: str?
